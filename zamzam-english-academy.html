/* ---------- Shared speaking word-match (honest label, feeds smart engine) ---------- */
function wordCheck(target,out,key,onDone){
 var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){out.innerHTML="⚠️ Browser-kani aqoonsiga hadalka ma taageero. Dhegeyso oo cod dheer ku celceli — taasi waa tababar dhab ah. / Speech check is not supported here — listen and repeat aloud instead.";if(onDone)onDone(null);return}
 try{var r=new SR();r.lang="en-GB";r.interimResults=false;
 r.onresult=function(e){var said=e.results[0][0].transcript;var tw=norm(target).split(" ").filter(Boolean);var sw=norm(said).split(" ").filter(Boolean);var hit=tw.filter(function(w){return sw.indexOf(w)>=0}).length;var full=hit===tw.length;
  if(!Array.isArray(S.skillLog))S.skillLog=[];S.skillLog.push({skill:"speaking",ok:full?1:0,date:todayStr()});
  if(!guestMode){if(full){recDay(S,key,todayStr());recDay(S,"sk:speaking|"+key,todayStr());mistakeCorrect(S,key,todayStr())}else{mistakeAdd(S,{key:key,q:"Say it in English: "+target,qSo:"Ingiriisi ku dheh: "+target,ans:target,why:target,type:"speaking",lesson:0,wordEn:"",wordSo:""})}}
  save();if(onDone)onDone({said:said,hit:hit,total:tw.length,full:full})};
 r.onerror=function(){out.textContent="Mikrofoonku ma shaqeyn. Dhegeyso oo ku celceli cod dheer. / The microphone did not work. Listen and repeat aloud.";if(onDone)onDone(null)};
 r.start();out.textContent="🎙️ Dhegeysanayaa... hadda dheh. / Listening... speak now."}catch(e){out.textContent="Mikrofoonku ma shaqeyn. / The microphone did not work.";if(onDone)onDone(null)}
}

var W4_EXPLAINER={id:"w4",icon:"🧾",en:"W-4 form explainer (education)",so:"Sharaxaadda foomka W-4 (waxbarasho)",edu:true,
 introEn:"When you start a job in the US, your employer gives you a Form W-4. It tells the employer how much tax to take from your pay. This page explains what each part means. It is NOT a tax filing and this app does not fill a W-4 for you.",
 introSo:"Markaad shaqo cusub ka bilowdo Mareykanka, shaqo-bixiyuhu wuxuu ku siinayaa Foomka W-4. Wuxuu u sheegaa shaqo-bixiyaha imisa cashuur ah oo mushaharkaaga laga gooyo. Boggan wuxuu sharxayaa macnaha qayb kasta. Kani MA AHA xarayn cashuur, app-kana W-4 kuu buuxin maayo.",
 steps:[
  {tEn:"Step 1 — Your personal information",tSo:"Tallaabada 1 — Macluumaadkaaga shakhsi",bEn:"Your full name, address, Social Security number and filing status (for example, Single or Married). On the REAL form this is private — you write it only on the employer's official form or official website, never in a practice app.",bSo:"Magacaaga oo buuxa, cinwaankaaga, lambarkaaga Social Security-ga iyo xaaladdaada cashuurta (tusaale: Single ama Married). Foomka DHABTA ah tani waa sir — waxaad ku qortaa oo keliya foomka rasmiga ah ee shaqo-bixiyaha ama boggiisa rasmiga ah, marnaba app tababar."},
  {tEn:"Step 2 — If you have more than one job",tSo:"Tallaabada 2 — Haddii aad leedahay shaqo ka badan hal",bEn:"Only for people with two jobs, or a husband/wife pair who both work. More jobs can mean more tax must be taken out.",bSo:"Waxaa loogu talagalay oo keliya dadka leh laba shaqo, ama lamaane labaduba shaqeeya. Shaqooyin badan waxay macnaheedu noqon kartaa cashuur badan oo la gooyo."},
  {tEn:"Step 3 — Your children and dependents",tSo:"Tallaabada 3 — Carruurtaada iyo dadka kugu tiirsan",bEn:"If you have children or other dependents, this part can make LESS tax come out of each pay, because the real tax at the end of the year will be smaller.",bSo:"Haddii aad leedahay carruur ama dad kale oo kugu tiirsan, qaybtani waxay yareyn kartaa cashuurta mushahar kasta laga gooyo, sababtoo ah cashuurta dhabta ah ee dhammaadka sanadka ayaa yaraan doonta."},
  {tEn:"Step 4 — Other changes (optional)",tSo:"Tallaabada 4 — Isbeddello kale (ikhtiyaari)",bEn:"Optional. Other money you earn, or extra tax you WANT taken out of each pay so you do not owe money later.",bSo:"Ikhtiyaari. Lacag kale oo aad hesho, ama cashuur dheeraad ah oo aad RABTO in mushahar kasta laga gooyo si aadan hadhow lacag u lahaansan."},
  {tEn:"Step 5 — Sign and date",tSo:"Tallaabada 5 — Saxeex oo taariikh qor",bEn:"You sign your name and write the date. Without a signature the form does not work. Give the paper form to your employer — do not send it to the IRS yourself.",bSo:"Waxaad saxeexdaa magacaaga oo waxaad qortaa taariikhda. Saxeex la'aan foomku ma shaqeeyo. Foomka warqadda ah shaqo-bixiyahaaga sii — IRS-ta adigu ha u dirin."}],

 diagPassage:{en:"The Garden Behind the Library — Our public library has a small garden behind the building. Every Saturday, families come to plant vegetables. Old Mr. Hassan teaches the children how to water the young plants. “Plants are like readers,” he says. “Give them a little care every day, and they grow strong.” Last spring the garden gave forty bags of vegetables to families in the neighbourhood. This year, the library hopes to grow even more.",so:"Beerta Maktabadda Dhabarkeeda — Maktabaddayada dadweynuhu waxay leedahay beer yar oo dhismaha dhabarkiisa ah. Sabti kasta, qoysasku waxay yimaadaan inay khudaar beeraan. Oday Xasan wuxuu carruurta barayaa sida geedaha yaryar loo waraabiyo. “Geeduhu waxay la mid yihiin akhristayaasha,” ayuu yidhi. “Maalin kasta daryeel yar sii, wayna xoogaysan doonaan.” Gu'gii hore beertu waxay qoysaska xaafadda siisay afartan kiish oo khudaar ah. Sanadkan, maktabaddu waxay rajaynaysaa inay kasii beerato."},
 diag:[
  {q:"What is the main idea of the passage?",qSo:"Waa maxay fikradda ugu weyn ee tuduca?",o:["A library garden helps families and teaches children","Mr. Hassan sells vegetables at the market","Libraries should close on Saturdays","Vegetables grow better without water"],a:0,wEn:"The whole passage is about the library garden: families plant, children learn, and families receive vegetables.",wSo:"Tuducu dhammaantiis wuxuu ku saabsan yahay beerta maktabadda: qoysasku way beeraan, carruurtu way bartaan, qoysaskuna khudaar bay helaan.",sk:"reading"},
  {q:"According to the passage, when do families come to the garden?",qSo:"Sida tuduca ku qoran, goorma ayay qoysasku beerta yimaadaan?",o:["Every Saturday","Every morning","Only in winter","On the last day of spring"],a:0,wEn:"The passage says: “Every Saturday, families come to plant vegetables.”",wSo:"Tuducu wuxuu yidhi: “Sabti kasta, qoysasku waxay yimaadaan inay khudaar beeraan.”",sk:"reading"},
  {q:"In the passage, Mr. Hassan says plants are “like readers.” What does he mean?",qSo:"Tuducan, Oday Xasan wuxuu yidhi geeduhu waxay “la mid yihiin akhristayaasha.” Maxuu ula jeedaa?",o:["Both grow strong with a little care every day","Readers must drink a lot of water","Plants can read books","Children should never read outside"],a:0,wEn:"He explains it himself: “Give them a little care every day, and they grow strong” — that is true for plants and for readers.",wSo:"Isagaa sharxaya: “Maalin kasta daryeel yar sii, wayna xoogaysan doonaan” — taasi waa run geedaha iyo akhristayaashaba.",sk:"reading"},
  {q:"How many bags of vegetables did the garden give last spring?",qSo:"Imisa kiish oo khudaar ah ayay beertu siisay gu'gii hore?",o:["Forty bags","Four bags","Fourteen bags","Fifty bags"],a:0,wEn:"The passage says “forty bags of vegetables” — forty is 40, not 4 or 14.",wSo:"Tuducu wuxuu yidhi “forty bags” — forty waa 40, ma aha 4 ama 14.",sk:"reading"},
  {q:"Choose the sentence with correct subject–verb agreement.",qSo:"Dooro jumladda leh isku-waafaqid sax ah oo qof iyo ficil (subject–verb).",o:["The children water the plants every Saturday.","The children waters the plants every Saturday.","The children watering the plants every Saturday.","The children is water the plants every Saturday."],a:0,wEn:"“Children” is plural, so the verb is “water” without -s. Only one person (he/she) takes -s: she waters.",wSo:"“Children” waa wadar (dad badan), sidaa darteed ficilku waa “water” -s la'aan. Hal qof oo keliya (he/she) ayaa -s qaata: she waters.",sk:"writing"},
  {q:"Which sentence is a complete sentence?",qSo:"Jumladdee baa jumlo dhamaystiran ah?",o:["She reads a story to her son every night.","Because the library was closed.","Running to the bus in the rain.","The book on the table near the door."],a:0,wEn:"A complete sentence has a subject and a verb and a full idea. “Because the library was closed” leaves us waiting — it is a fragment.",wSo:"Jumlo dhamaystiran waa inay leedahay qof sameeya, ficil, iyo fikrad buuxda. “Because the library was closed” waxay naga dhigaysaa sugitaan — waa jajab (fragment).",sk:"writing"},
  {q:"Which sentence uses punctuation correctly?",qSo:"Jumladdee baa si sax ah u isticmaasha hakadyada (punctuation)?",o:["On Tuesday, we visited the library.","On Tuesday we visited, the library.","On Tuesday. We visited the library on, Tuesday.","On, Tuesday we visited the library."],a:0,wEn:"A short opening phrase takes one comma after it: “On Tuesday, we visited the library.”",wSo:"Weedh furitaan oo gaaban waxay qaadataa hal hakad (comma) dabadeed: “On Tuesday, we visited the library.”",sk:"writing"},
  {q:"Choose the best way to combine: “I was tired. I finished my homework.”",qSo:"Dooro habka ugu fiican ee la isugu geeyo: “I was tired. I finished my homework.”",o:["I was tired, but I finished my homework.","I was tired the homework finished I.","I was tired. Because homework.","I finished my homework tired I was."],a:0,wEn:"“But” joins two full sentences and shows the contrast — tired, BUT still finished.",wSo:"“But” waxay isku xirtaa laba jumlo oo buuxa waxayna muujisaa iska-horimaadka — daallan, LAAKIIN weli wuu dhammeeyay.",sk:"writing"},
  {q:"In the sentence “The generous neighbour shared her bread,” the word “generous” means:",qSo:"Jumladda “The generous neighbour shared her bread,” erayga “generous” wuxuu macnaheedu yahay:",o:["Happy to give to others","Angry at other people","Very rich and famous","Afraid of neighbours"],a:0,wEn:"She SHARED her bread — sharing shows she is happy to give. That is what “generous” means.",wSo:"Iyadu waxay LA WADAAGTAY rootigeeda — wadaagistu waxay muujisaa inay ku faraxsan tahay bixinta. Taasi waa macnaha “generous”.",sk:"reading"},
  {q:"A writer writes: “School libraries should stay open in the evening so working parents can study with their children.” This sentence is mainly:",qSo:"Qoraa wuxuu qoray: “Maktabadaha dugsiyadu waa inay fiidkii furan yihiin si waalidiinta shaqeeya ay carruurtooda ula bartaan.” Jumladdani badanaa waa:",o:["An opinion with a reason","A story about a family","Directions to a library","A list of library books"],a:0,wEn:"“Should” gives an opinion, and “so working parents can…” gives the reason for it.",wSo:"“Should” waxay bixisaa fikrad, “so working parents can…” waxay bixisaa sababta fikraddaas.",sk:"reading"}],
 lessons:[
  {id:"mainidea",tEn:"Finding the main idea",tSo:"Helitaanka fikradda ugu weyn",bEn:"The main idea is what the whole passage is mostly about — not one small detail. Read the first and last sentences, then ask: what is true about ALL of the passage?",bSo:"Fikradda ugu weyn waa waxa tuducu badanaa ku saabsan yahay — ma aha faahfaahin yar oo keliya. Akhri jumladda koowaad iyo tan ugu dambeysa, kadib is weydii: maxaa run ah oo tuduca DHAN khuseeya?",
   ex:[{en:"Passage: “Walking is good exercise. It makes your heart strong. It costs no money. Many people walk in the park every morning.”",so:"Tuduc: “Socodku waa jimicsi wanaagsan. Wuxuu wadnahaaga xoojiyaa. Lacag ma kugu kaco. Dad badan baa subax kasta beerta ku socda.”"},{en:"Step 1: The first sentence says walking is GOOD EXERCISE — that sounds like the topic.",so:"Tallaabada 1: Jumladda koowaad waxay tidhi socodku waa JIMICSI WANAAGSAN — taasi waxay u eg tahay mawduuca."},{en:"Step 2: The other sentences give REASONS (heart, free, people do it) — they support the first sentence.",so:"Tallaabada 2: Jumladooyinka kale waxay bixiyaan SABABO (wadne, lacag la'aan, dadku way sameeyaan) — waxay taageeraan jumladda koowaad."},{en:"Answer: The main idea is “Walking is good exercise.”",so:"Jawaabta: Fikradda ugu weyn waa “Socodku waa jimicsi wanaagsan.”"}]},
  {id:"agreement",tEn:"Complete sentences and subject–verb agreement",tSo:"Jumlado dhamaystiran iyo isku-waafaqidda qofka iyo ficilka",bEn:"Every complete sentence needs a subject (who or what) and a verb (what they do). One person: he/she + verb with -s (she reads). Many people: no -s (they read).",bSo:"Jumlo kasta oo dhamaystiran waxay u baahan tahay qof sameeya (yaa ama maxaa) iyo ficil (waxa uu sameeyo). Hal qof: he/she + ficil -s leh (she reads). Dad badan: -s la'aan (they read).",
   ex:[{en:"Sentence: “The bus ___ at eight o'clock.” (stop / stops)",so:"Jumlo: “Basku wuxuu ___ siddeedda.” (stop / stops)"},{en:"Step 1: The subject is “the bus” — ONE thing, like “it”.",so:"Tallaabada 1: Sameeyuhu waa “the bus” — HAL shay, sida “it”."},{en:"Step 2: One thing takes -s, like he/she. So: “The bus STOPS at eight o'clock.”",so:"Tallaabada 2: Hal shay wuxuu qaataa -s, sida he/she. Sidaa darteed: “Basku wuu JOOJISANAA (STOPS) siddeedda.”"}]},
  {id:"essay",tEn:"Writing your essay: opinion, reasons, examples",tSo:"Maqaalkaaga qorid: fikrad, sababo, tusaalooyin",bEn:"The RLA test asks you to write an essay: say your opinion clearly, give two or three reasons, and support each reason with an example. The app cannot grade your essay — use the model outline and the self-check rubric below to check your own work.",bSo:"Imtixaanka RLA wuxuu ku weydiinayaa inaad maqaal qorto: fikraddaada si cad u dheh, laba ama saddex sababood sii, sabab kastana tusaale ku taageer. App-ku ma qiimeyn karo maqaalkaaga — isticmaal qaabka tusaalaha iyo liiska is-hubinta hoose si aad shaqadaada u hubiso.",
   ex:[{en:"Essay task: Some people say children should help at home every day. Other people say children should only study and play. Which do you think is better? Write your opinion, two reasons, and an example for each reason.",so:"Hawsha maqaalka: Dad baa yidhaahda carruurtu waa inay maalin kasta guriga caawiyaan. Dad kale waxay yidhaahdaan carruurtu waa inay wax bartaan oo ciyaaraan oo keliya. Midkee baad u aragtaa inuu fiican yahay? Qor fikraddaada, laba sababood, iyo tusaale sabab kasta."},{en:"Model outline — Paragraph 1: My opinion: children should help at home a little every day.",so:"Qaab tusaale — Tuduca 1: Fikradayda: carruurtu waa inay maalin kasta wax yar guriga caawiyaan."},{en:"Paragraph 2: Reason 1 — helping teaches responsibility. Example: my son feeds the cat, and now he remembers his school bag too.",so:"Tuduc 2: Sababta 1 — caawintu waxay barta xilkasnimada. Tusaale: wiilkaygu bisadda wuu quudiyaa, haddana boorsadiisa dugsigana wuu xusuusnaa."},{en:"Paragraph 3: Reason 2 — families have less work. Example: when everyone washes one dish, the kitchen is clean in five minutes.",so:"Tuduc 3: Sababta 2 — qoysasku shaqo yar bay leeyihiin. Tusaale: marka qof kasta suxun mid dhaqo, jikadu shan daqiiqo bay ku nadiif noqotaa."},{en:"Paragraph 4: End — say your opinion again in new words.",so:"Tuduc 4: Dhamaadka — fikraddaada mar kale dheh erayo cusub."}],
   essay:{rubric:[["I wrote my opinion clearly in the first paragraph","Fikradayda si cad baan u qoray tuduca koowaad"],["I gave two or three reasons","Waxaan siiyay laba ama saddex sababood"],["Each reason has an example","Sabab kastaa waxay leedahay tusaale"],["Every sentence is complete (subject + verb)","Jumlo kasta waa dhamaystiran tahay (qof + ficil)"],["I checked capital letters and full stops","Waxaan hubiyay xarfaha waaweyn iyo dhibcaha (full stops)"]]}}],
 examMin:30,
 examPassage:{en:"New Buses for Our City — Next month, our city will add twelve new buses. The transport office says the new buses will run every fifteen minutes on the busiest streets. “Many workers wait thirty minutes today,” said the office manager. “That is too long.” The new buses are also lower, so older people and parents with small children can get on easily. Some people worry about the cost, but the office says the money comes from a state grant, not from higher ticket prices.",so:"Basas Cusub oo Magaaladeenna ah — Bisha dambe, magaaladeenna waxay ku dari doontaa laba iyo toban bas oo cusub. Xafiiska gaadiidku wuxuu yidhi basaska cusubi waxay shan iyo toban daqiiqoba mar maraan waddooyinka ugu mashquulka badan. “Shaqaale badan baa maanta soddon daqiiqo suga,” ayuu yidhi maareeyaha xafiisku. “Taasi waa waqti aad u dheer.” Basaska cusub sidoo kale way hooseeyaan, si dadka waaweyn iyo waalidiinta carruurta yaryar leh ay si fudud u fuulaan. Dad baa ka welwela kharashka, laakiin xafiisku wuxuu yidhi lacagtu waxay ka timid deeq gobol, ma aha qiime tigidh oo kordhay."},
 exam:[
  {q:"What is the main idea of the passage?",qSo:"Waa maxay fikradda ugu weyn ee tuduca?",o:["The city will add new buses to help riders","The city will sell its old buses","Bus drivers want higher pay","Ticket prices will go up next month"],a:0,wEn:"Everything in the passage is about the new buses: more buses, easier to use, and how they are paid for.",wSo:"Wax kasta oo tuduca ku jira wuxuu ku saabsan yahay basaska cusub: basas badan, fudayd fuulid, iyo sida loo bixiyay.",sk:"reading"},
  {q:"How often will the new buses run on the busiest streets?",qSo:"Imisa jeer bay basaska cusubi maraan waddooyinka ugu mashquulka badan?",o:["Every fifteen minutes","Every thirty minutes","Every hour","Twelve times a day"],a:0,wEn:"The passage says the buses “will run every fifteen minutes.” Thirty minutes is how long workers wait TODAY.",wSo:"Tuducu wuxuu yidhi basasku “shan iyo toban daqiiqoba mar bay maraan.” Soddon daqiiqo waa inta shaqaaluhu MAANTA sugaan.",sk:"reading"},
  {q:"Why are the new buses lower?",qSo:"Maxay basaska cusubi u hooseeyaan?",o:["So older people and parents with children can get on easily","So they can drive under low bridges","So they use less fuel","So drivers can see better"],a:0,wEn:"The passage gives the reason directly: “so older people and parents with small children can get on easily.”",wSo:"Tuducu sababta si toos ah buu u bixiyay: “si dadka waaweyn iyo waalidiinta carruurta yaryar leh ay si fudud u fuulaan.”",sk:"reading"},
  {q:"Where does the money for the new buses come from?",qSo:"Lacagta basaska cusub xaggee bay ka timid?",o:["A state grant","Higher ticket prices","The bus drivers","A library garden"],a:0,wEn:"The office says the money “comes from a state grant, not from higher ticket prices.”",wSo:"Xafiisku wuxuu yidhi lacagtu “waxay ka timid deeq gobol, ma aha qiime tigidh oo kordhay.”",sk:"reading"},
  {q:"Which sentence from the passage is an opinion, not a fact?",qSo:"Jumladdee tuduca ku jirta baa fikrad ah, ma aha xaqiiq (fact)?",o:["“That is too long.”","“The city will add twelve new buses.”","“The new buses are lower.”","“The buses will run every fifteen minutes.”"],a:0,wEn:"“That is too long” is what the manager THINKS. The others can be checked and counted — they are facts.",wSo:"“Taasi waa waqti aad u dheer” waa waxa maareeyuhu FIKIRAYO. Kuwa kale waa la hubin karaa oo la tirin karaa — waa xaqiiqooyin.",sk:"reading"},
  {q:"Choose the correctly punctuated sentence.",qSo:"Dooro jumladda hakadkeedu (punctuation) sax yahay.",o:["My brother, who lives in Ohio, drives a bus.","My brother who lives in Ohio, drives a bus.","My brother, who lives in Ohio drives a bus.","My, brother who lives in Ohio drives a bus."],a:0,wEn:"Extra information in the middle of a sentence needs a comma before AND after it: “My brother, who lives in Ohio, drives a bus.”",wSo:"Macluumaad dheeraad ah oo jumladda dhexdeeda ah wuxuu u baahan yahay hakad ka horreeya IYO mid daba socda.",sk:"writing"},
  {q:"Choose the sentence with correct subject–verb agreement.",qSo:"Dooro jumladda leh isku-waafaqid sax ah oo qof iyo ficil.",o:["The buses stop near my house.","The buses stops near my house.","The buses is stop near my house.","The buses stopping near my house."],a:0,wEn:"“Buses” is plural, so the verb has no -s: “The buses stop.”",wSo:"“Buses” waa wadar, sidaa darteed ficilku -s ma laha: “The buses stop.”",sk:"writing"},
  {q:"Which is the best revision? “The soup was hot. I waited. Then I ate it slowly.”",qSo:"Midkee baa dib-u-qorista ugu fiican? “Maraqu wuu kululaa. Waan sugay. Kadib tartiib baan u cunay.”",o:["The soup was hot, so I waited and then ate it slowly.","The soup was hot I waited ate slowly.","Hot soup waited I it slowly ate.","The soup. Was hot. Waited. Ate slowly it."],a:0,wEn:"Joining the small sentences with “so” and “and then” makes one clear, flowing sentence.",wSo:"Jumladaha yaryar oo lagu xiro “so” iyo “and then” waxay sameeyaan jumlo cad oo socota.",sk:"writing"},
  {q:"In “The tired driver rested after the long journey,” the word “journey” means:",qSo:"“The tired driver rested after the long journey” — erayga “journey” wuxuu macnaheedu yahay:",o:["A trip from one place to another","A kind of food","A bus ticket","A work uniform"],a:0,wEn:"A driver rests after travelling — a journey is a trip.",wSo:"Darawalku wuu nastaa safarka kadib — journey waa safar.",sk:"reading"},
  {q:"Which sentence needs a capital letter added?",qSo:"Jumladdee baa u baahan xaraf weyn oo lagu daro?",o:["we start school in september.","The bus is late today.","She reads every night.","I have a new book."],a:0,wEn:"Every sentence starts with a capital letter, and months (September) are also capital in English.",wSo:"Jumlo kasta waxay ku bilaabataa xaraf weyn, bilaha (September) sidoo kale Ingiriisiga waa xaraf weyn.",sk:"writing"},
  {q:"A paragraph begins: “First, wash the rice two times.” The word “First” tells the reader:",qSo:"Tuduc wuxuu ku bilaabmaa: “First, wash the rice two times.” Erayga “First” wuxuu akhristaha u sheegaa:",o:["This is the first step in a set of instructions","The rice is the first food","Washing is finished","The writer's first name"],a:0,wEn:"Words like First, Then, Finally show the ORDER of steps.",wSo:"Erayada sida First, Then, Finally waxay muujiyaan HABKA tallaabooyinka.",sk:"reading"},
  {q:"Choose the clearest sentence for a formal email.",qSo:"Dooro jumladda ugu cad ee iimayl rasmi ah.",o:["I am writing to ask about the English class.","Hey, what's up with the class thing?","Class?? Tell me now.","i wanna know about class"],a:0,wEn:"A formal email uses full sentences, capital letters, and polite, clear words.",wSo:"Iimayl rasmi ahi wuxuu isticmaalaa jumlado buuxa, xarfo waaweyn, iyo erayo edeb leh oo cad.",sk:"writing"}]},
math:{
 diagMin:15,
 diag:[
  {q:"What is 1/2 + 1/4?",qSo:"Waa imisa 1/2 + 1/4?",o:["3/4","2/6","1/6","1/8"],a:0,wEn:"Make the bottoms the same: 1/2 = 2/4. Then 2/4 + 1/4 = 3/4.",wSo:"Hoostayaasha isku mid ka dhig: 1/2 = 2/4. Kadib 2/4 + 1/4 = 3/4."},
  {q:"What is 25% of 80?",qSo:"Waa imisa 25% ee 80?",o:["20","25","40","15"],a:0,wEn:"25% means one quarter. 80 ÷ 4 = 20.",wSo:"25% waxay macnaheedu tahay rubuc (afar meelood mid). 80 ÷ 4 = 20."},
  {q:"A shirt costs $40. It is on sale for 50% off. What do you pay?",qSo:"Shaati wuxuu ku kacaa $40. Wuxuu leeyahay qiimo-dhimis 50%. Imisa baad bixinaysaa?",o:["$20","$10","$30","$35"],a:0,wEn:"50% off means you pay half: $40 ÷ 2 = $20.",wSo:"50% dhimis waxay macnaheedu tahay badh baad bixinaysaa: $40 ÷ 2 = $20."},
  {q:"Solve: x + 7 = 15. What is x?",qSo:"Xalli: x + 7 = 15. Waa imisa x?",o:["8","22","7","15"],a:0,wEn:"Take 7 away from both sides: 15 − 7 = 8. Check: 8 + 7 = 15. ✓",wSo:"7 ka goo labada dhinacba: 15 − 7 = 8. Hubi: 8 + 7 = 15. ✓"},
  {q:"A room is 5 metres long and 4 metres wide. What is its area?",qSo:"Qol wuxuu dhererkiisu yahay 5 mitir, ballaadhkiisuna 4 mitir. Waa imisa beddelkiisu (area)?",o:["20 square metres","9 square metres","18 square metres","40 square metres"],a:0,wEn:"Area = length × width = 5 × 4 = 20 square metres.",wSo:"Area = dherer × ballaadh = 5 × 4 = 20 mitir oo laba-jibbaaran."},
  {q:"For every 2 cups of flour, a recipe uses 1 cup of sugar. How much sugar for 8 cups of flour?",qSo:"2 koob oo bur ah kasta, cunto-karistu waxay isticmaashaa 1 koob oo sonkor ah. 8 koob oo bur ah imisa sonkor ah?",o:["4 cups","2 cups","8 cups","16 cups"],a:0,wEn:"8 cups is 4 groups of 2. Each group needs 1 cup of sugar: 4 × 1 = 4 cups.",wSo:"8 koob waa 4 koox oo 2 ah. Koox kasta waxay u baahan tahay 1 koob oo sonkor ah: 4 × 1 = 4 koob."},
  {q:"A bar chart shows: Monday 10 books, Tuesday 25 books, Wednesday 15 books. On which day were most books sold?",qSo:"Jaantus tiirar leh wuxuu muujinayaa: Isniin 10 buug, Talaado 25 buug, Arbaco 15 buug. Maalinteebaa buugaagta ugu badan la iibiyay?",o:["Tuesday","Monday","Wednesday","All days are the same"],a:0,wEn:"Compare the numbers: 25 is bigger than 15 and 10. Tuesday has the tallest bar.",wSo:"Is barbar dhig tirooyinka: 25 waxuu ka weyn yahay 15 iyo 10. Talaadada ayaa leh tiirka ugu dheer."},
  {q:"What is 3.5 + 2.25?",qSo:"Waa imisa 3.5 + 2.25?",o:["5.75","5.30","6.75","5.25"],a:0,wEn:"Line up the decimal points: 3.50 + 2.25 = 5.75.",wSo:"Dhibcaha tobanlaha (decimal) saf geli: 3.50 + 2.25 = 5.75."},
  {q:"A bus travels 60 miles in 2 hours. How many miles does it travel in 1 hour?",qSo:"Bas wuxuu socdaa 60 meyl 2 saacadood gudahood. Saacad 1 gudahood imisa meyl buu socdaa?",o:["30 miles","60 miles","120 miles","20 miles"],a:0,wEn:"60 ÷ 2 = 30 miles in one hour.",wSo:"60 ÷ 2 = 30 meyl saacaddii."},
  {q:"What is the next number? 5, 10, 20, 40, ___",qSo:"Waa imisa tirada xigta? 5, 10, 20, 40, ___",o:["80","50","60","45"],a:0,wEn:"Each number is double the one before: 40 × 2 = 80.",wSo:"Tiro kasta waa laba jibbaar tii ka horreysay: 40 × 2 = 80."}],
 lessons:[
  {id:"fracpct",tEn:"Fractions, decimals and percents are the same idea",tSo:"Jajabyada, tobanlayaasha iyo boqolleydu waa isku fikrad",bEn:"1/2, 0.5 and 50% are the same amount in three clothes. To change a fraction to a percent: divide the top by the bottom, then multiply by 100.",bSo:"1/2, 0.5 iyo 50% waa isku qiyaas saddex dhar oo kala duwan. Si jajab boqolley loogu beddelo: kore u qaybi hoose, kadib ku dhufo 100.",
   ex:[{en:"Change 3/4 to a percent. Step 1: 3 ÷ 4 = 0.75.",so:"3/4 u beddel boqolkiiba. Tallaabada 1: 3 ÷ 4 = 0.75."},{en:"Step 2: 0.75 × 100 = 75. Answer: 3/4 = 75%.",so:"Tallaabada 2: 0.75 × 100 = 75. Jawaabtu: 3/4 = 75%."}]},
  {id:"algebra",tEn:"Basic algebra: keep the balance",tSo:"Aljebrada aasaasiga ah: miisaanka ilaalin",bEn:"An equation is like a balance. Whatever you do to one side, do to the other side. To find x, move the numbers away from x one step at a time.",bSo:"Isle'egtu (equation) waxay la mid tahay miisaan. Wax kasta oo aad dhinac ku samayso, kan kale ku samee. Si aad x u hesho, tirooyinka ka fogee x tallaabo tallaabo.",
   ex:[{en:"Solve 2x + 3 = 11. Step 1: take 3 from both sides: 2x = 8.",so:"Xalli 2x + 3 = 11. Tallaabada 1: 3 ka goo labada dhinacba: 2x = 8."},{en:"Step 2: divide both sides by 2: x = 4. Check: 2×4 + 3 = 11. ✓",so:"Tallaabada 2: labada dhinac u qaybi 2: x = 4. Hubi: 2×4 + 3 = 11. ✓"}]},
  {id:"geometry",tEn:"Area and perimeter; reading graphs",tSo:"Beddelka iyo wareegga; akhrinta jaantusyada",bEn:"Perimeter is the distance AROUND a shape — add all the sides. Area is the space INSIDE — for a rectangle, length × width. On a bar chart, compare the heights (or lengths) of the bars.",bSo:"Wareeggu (perimeter) waa masaafada KUWAREEGSAN qaabka — dhinacyada oo dhan isku dar. Beddelku (area) waa meesha GUDAHA — afargeesle, dherer × ballaadh. Jaantuska tiirarka, is barbar dhig dhererka tiirarka.",
   ex:[{en:"A garden is 6 m by 3 m. Perimeter: 6 + 3 + 6 + 3 = 18 m.",so:"Beer waa 6 m iyo 3 m. Wareegga: 6 + 3 + 6 + 3 = 18 m."},{en:"Area: 6 × 3 = 18 square metres. Same number, different meaning!",so:"Beddelka: 6 × 3 = 18 mitir oo laba-jibbaaran. Isku tiro, macno kala duwan!"}]}],
 examMin:25,
 exam:[
  {q:"What is 2/3 of 30?",qSo:"Waa imisa 2/3 ee 30?",o:["20","10","15","25"],a:0,wEn:"30 ÷ 3 = 10. Then 10 × 2 = 20.",wSo:"30 ÷ 3 = 10. Kadib 10 × 2 = 20."},
  {q:"What is 10% of 250?",qSo:"Waa imisa 10% ee 250?",o:["25","250","2.5","125"],a:0,wEn:"10% means divide by 10: 250 ÷ 10 = 25.",wSo:"10% waxay macnaheedu tahay u qaybi 10: 250 ÷ 10 = 25."},
  {q:"Solve: 3x = 27. What is x?",qSo:"Xalli: 3x = 27. Waa imisa x?",o:["9","24","81","30"],a:0,wEn:"Divide both sides by 3: 27 ÷ 3 = 9. Check: 3 × 9 = 27. ✓",wSo:"Labada dhinac u qaybi 3: 27 ÷ 3 = 9. Hubi: 3 × 9 = 27. ✓"},
  {q:"A square garden has sides of 7 metres. What is its perimeter?",qSo:"Beer afargees ah dhinacyadeedu waa 7 mitir midkiiba. Waa imisa wareeggeedu?",o:["28 metres","49 metres","14 metres","21 metres"],a:0,wEn:"A square has 4 equal sides: 7 × 4 = 28 metres. (49 would be the AREA.)",wSo:"Afargeesku wuxuu leeyahay 4 dhinac oo isku mid ah: 7 × 4 = 28 mitir. (49 waa BEDDELKA.)"},
  {q:"Which fraction is the biggest?",qSo:"Jajabkee baa ugu weyn?",o:["3/4","1/2","2/5","1/3"],a:0,wEn:"As percents: 3/4 = 75%, 1/2 = 50%, 2/5 = 40%, 1/3 ≈ 33%. 3/4 is biggest.",wSo:"Boqolley ahaan: 3/4 = 75%, 1/2 = 50%, 2/5 = 40%, 1/3 ≈ 33%. 3/4 ayaa ugu weyn."},
  {q:"A phone costs $200. The price goes UP by 10%. What is the new price?",qSo:"Telefoon wuxuu ku kacaa $200. Qiimihu wuxuu KORDHAA 10%. Waa imisa qiimaha cusub?",o:["$220","$210","$180","$190"],a:0,wEn:"10% of 200 is 20. Price goes up: 200 + 20 = $220.",wSo:"10% ee 200 waa 20. Qiimuhu wuu kordhay: 200 + 20 = $220."},
  {q:"If 5 notebooks cost $10, how much do 8 notebooks cost at the same price each?",qSo:"Haddii 5 buug-xusuusqor ay ku kacaan $10, 8 buug imisa bay ku kacaan isla qiimahaas?",o:["$16","$13","$18","$40"],a:0,wEn:"One notebook: $10 ÷ 5 = $2. Then 8 × $2 = $16.",wSo:"Hal buug: $10 ÷ 5 = $2. Kadib 8 × $2 = $16."},
  {q:"Round 47.6 to the nearest whole number.",qSo:"47.6 u wareeji tirada buuxda ee ugu dhow.",o:["48","47","50","46"],a:0,wEn:"The digit after the point is 6 — 5 or more rounds UP: 48.",wSo:"Lambarka dhibicda kadib waa 6 — 5 ama ka badan kor buu u wareejiyaa: 48."},
  {q:"A chart shows rainfall: Week 1 = 2 cm, Week 2 = 5 cm, Week 3 = 3 cm. What is the TOTAL rainfall?",qSo:"Jaantus wuxuu muujinayaa roob: Usbuuca 1 = 2 cm, Usbuuca 2 = 5 cm, Usbuuca 3 = 3 cm. Waa imisa ISKU-DARKA roobku?",o:["10 cm","8 cm","15 cm","6 cm"],a:0,wEn:"Add them: 2 + 5 + 3 = 10 cm.",wSo:"Isku dar: 2 + 5 + 3 = 10 cm."},
  {q:"What is 0.6 as a fraction in its simplest form?",qSo:"Waa maxay 0.6 jajab ahaan qaabkiisa ugu fudud?",o:["3/5","6/100","1/6","6/1"],a:0,wEn:"0.6 = 6/10. Divide top and bottom by 2: 3/5.",wSo:"0.6 = 6/10. Kor iyo hoos u qaybi 2: 3/5."},
  {q:"A worker earns $15 per hour. How much for 6 hours?",qSo:"Shaqaale wuxuu helaa $15 saacaddii. 6 saacadood imisa?",o:["$90","$21","$60","$95"],a:0,wEn:"15 × 6 = 90 dollars.",wSo:"15 × 6 = 90 doollar."},
  {q:"Solve: x − 9 = 4. What is x?",qSo:"Xalli: x − 9 = 4. Waa imisa x?",o:["13","5","36","−5"],a:0,wEn:"Add 9 to both sides: 4 + 9 = 13. Check: 13 − 9 = 4. ✓",wSo:"9 ku dar labada dhinacba: 4 + 9 = 13. Hubi: 13 − 9 = 4. ✓"}]},
sci:{
 diagMin:15,
 diag:[
  {q:"In a food chain — grass → goat → lion — what does the arrow mean?",qSo:"Silsilad cunto — caws → ri' → libaax — maxay falaartu (arrow) macnaheedu tahay?",o:["Energy moves this way when one is eaten","The lion eats the grass","All three eat each other","The grass is the strongest"],a:0,wEn:"The arrow shows the path of energy: the goat eats the grass, the lion eats the goat.",wSo:"Falaartu waxay muujisaa jidka tamarta: riyuhu cawska buu cunaa, libaaxuna riyaha buu cunaa."},
  {q:"Which is the powerhouse of the cell — the part that gives the cell energy?",qSo:"Midkee baa ah xarunta tamarta unugga (cell) — qaybta unugga tamarta siisa?",o:["The mitochondria","The cell wall","The nucleus only stores food","The ribosome makes light"],a:0,wEn:"Mitochondria change food into energy the cell can use.",wSo:"Mitochondria waxay cuntada u beddeshaa tamar unuggu isticmaali karo."},
  {q:"Water is heated and becomes steam. This change of state is called:",qSo:"Biyaha waa la kululeeyaa waxayna noqdaan uumi. Isbeddelkan waa:",o:["Evaporation","Freezing","Melting","Condensation into ice"],a:0,wEn:"Liquid water turning into gas (steam) is evaporation. Freezing is the opposite direction.",wSo:"Biyo dareere ah oo u baxa gaas (uumi) waa uumi-bax (evaporation). Qaboojintu waa jihada lidka ah."},
  {q:"In the water cycle, water vapour in the air cools and forms clouds. This step is called:",qSo:"Wareegga biyaha, uumiga biyaha ee hawadu wuu qaboobaa wuxuuna sameeyaa daruuro. Tallaabadani waa:",o:["Condensation","Evaporation","Precipitation only","Photosynthesis"],a:0,wEn:"Cooling vapour joining into drops is condensation — it makes clouds before rain falls.",wSo:"Uumi qabooba oo dhibco noqda waa isku-ururin (condensation) — wuxuu sameeyaa daruur ka hor inta uusan roobku dhicin."},
  {q:"Which planet do we live on, and which star is closest to it?",qSo:"Meeraha aynu ku noolnahay waa kuma, xiddigta ugu dhowse waa tee?",o:["Earth, and the Sun","Mars, and the Moon","Earth, and Mars","Venus, and the Sun"],a:0,wEn:"We live on Earth. The Sun is our closest star — the Moon is not a star.",wSo:"Waxaan ku noolnahay Dhulka. Qorraxdu waa xiddigta noogu dhow — Dayaxu xiddig ma aha."},
  {q:"A student puts a plant near a window and another plant in a dark box. After two weeks the dark plant is yellow and weak. What is the best conclusion?",qSo:"Arday wuxuu geed dhigay daaqad agteed, mid kalena sanduuq mugdi ah. Laba usbuuc kadib geedkii mugdigu waa jaalle oo daciif. Gabagabada ugu fiican waa tee?",o:["Plants need light to grow well","The box was too small","Yellow is the plant's normal colour","Plants do not need water"],a:0,wEn:"Only ONE thing was different — the light. The dark plant became weak, so plants need light to grow well.",wSo:"Hal shay oo keliya ayaa kala duwanaa — iftiinka. Geedkii mugdigu daciif buu noqday, sidaa darteed geeduhu iftiin bay u baahan yihiin si ay u koraan."},
  {q:"Which simple machine helps lift a heavy box using a sloping surface?",qSo:"Mashiin fudud oo kee baa caawiya in sanduuq culus kor loo qaado iyadoo la isticmaalayo meel janjeerta?",o:["An inclined plane (a ramp)","A magnet","A battery","A mirror"],a:0,wEn:"A ramp is an inclined plane — it spreads the lifting work over a longer distance.",wSo:"Jid-janjeerku waa meel janjeerta (inclined plane) — wuxuu shaqada qaadista ku faafiyaa masaafo dheer."},
  {q:"Why does the Moon look different on different nights (new moon, half moon, full moon)?",qSo:"Maxaa Dayaxu habeenno kala duwan u muuqdaa si kala duwan (dayax cusub, badh, buuxa)?",o:["We see different parts of the sunlit side as it moves around Earth","The Moon changes its shape","Clouds always cover half of it","The Moon turns its light off"],a:0,wEn:"The Moon does not change. As it travels around Earth, we see different amounts of its sunlit half.",wSo:"Dayaxu isma beddelo. Markuu Dhulka ku wareego, waxaan aragnaa qaybo kala duwan oo badhkiisa cadceeddu iftiimisay."},
  {q:"A table shows plant heights: Week 1 = 4 cm, Week 2 = 7 cm, Week 3 = 11 cm. How much did the plant grow from Week 1 to Week 3?",qSo:"Shax wuxuu muujinayaa dhererka geed: Usbuuca 1 = 4 cm, Usbuuca 2 = 7 cm, Usbuuca 3 = 11 cm. Imisa buu geedku koray Usbuuca 1 ilaa 3?",o:["7 cm","11 cm","4 cm","3 cm"],a:0,wEn:"Growth = last − first = 11 − 4 = 7 cm.",wSo:"Koritaanku = kan dambe − kan hore = 11 − 4 = 7 cm."},
  {q:"Which of these is a chemical change, not just a change of shape?",qSo:"Midkee baa ah isbeddel kiimiko, ma aha isbeddel qaab oo keliya?",o:["Wood burning and becoming ash","Ice melting into water","Paper being cut with scissors","Clay made into a cup"],a:0,wEn:"Burning makes NEW substances (ash, smoke, gases). Melting, cutting and shaping keep the same substance.",wSo:"Gubashadu waxay sameysaa walxo CUSUB (dambas, qiiq, gaas). Dhalaalidda, goynta iyo qaabeyntu waxay hayaan isla walaxdii."}],
 lessons:[
  {id:"foodchain",tEn:"Food chains and ecosystems",tSo:"Silsiladaha cuntada iyo nidaamyada noolaha",bEn:"Plants make food from sunlight (producers). Animals eat plants or other animals (consumers). The arrow in a food chain shows where the ENERGY goes: from the food to the eater.",bSo:"Geeduhu waxay cunto ka sameeyaan cadceedda (soo-saareyaal). Xayawaanku waxay cunaan geedo ama xayawaan kale (cuneyaal). Falaarta silsiladda cuntadu waxay muujisaa halka TAMARTU aado: cuntada ilaa cunaha.",
   ex:[{en:"☀️ Sun → 🌿 Grass → 🐐 Goat → 🦁 Lion. The Sun gives the grass energy.",so:"☀️ Cadceed → 🌿 Caws → 🐐 Ri' → 🦁 Libaax. Cadceeddu waxay cawska siisaa tamar."},{en:"Worked example: Who eats the goat? Follow the arrow FROM the goat: grass → goat → lion. The lion eats the goat.",so:"Tusaale la xalliyay: Yaa riyaha cuna? Falaarta ka raac RIYAHA: caws → ri' → libaax. Libaaxaa riyaha cuna."},{en:"And the goat's energy came from the grass, and the grass's energy came from the Sun.",so:"Tamarta riyuhuna waxay ka timid cawska, cawskuna cadceedda."}]},
  {id:"states",tEn:"States of matter and energy",tSo:"Xaaladaha maatar (adag, dareere, gaas) iyo tamarta",bEn:"Matter can be solid (ice), liquid (water) or gas (steam). Adding heat can melt and evaporate it; taking heat away can condense and freeze it. Heat moves from hot things to cold things.",bSo:"Maatar wuxuu noqon karaa adag (baraf), dareere (biyo) ama gaas (uumi). Kulaylku wuu dhalaalin karaa oo uumi ka dhigi karaa; kulayl ka qaadistu waxay isku-ururin kartaa oo qaboojin kartaa. Kulaylku wuxuu ka socdaa waxa kulul ilaa waxa qabow.",
   ex:[{en:"Example: an ice cube in a warm room. Step 1: the room's heat moves INTO the ice.",so:"Tusaale: baraf qol diirran ku jira. Tallaabada 1: kulaylka qolku wuxuu GALAA barafka."},{en:"Step 2: the ice melts — solid becomes liquid. Step 3: if we heat the water more, it evaporates — liquid becomes gas.",so:"Tallaabada 2: barafku wuu dhalaalaa — adaggu wuxuu noqdaa dareere. Tallaabada 3: haddii biyaha kulayl dheeraad ah la siiyo, way uumi baxaan — dareeruhu wuxuu noqdaa gaas."}]},
  {id:"experiment",tEn:"Reading a simple experiment",tSo:"Akhrinta tijaabo fudud",bEn:"In a fair test, you change ONE thing and keep everything else the same. Then you measure the result and draw a conclusion that the numbers support — nothing more.",bSo:"Tijaabo cadaalad ah, waxaad beddeshaa HAL shay waxaadna haysaa wax kasta oo kale isla sidii. Kadib waxaad cabbirtaa natiijada waxaadna soo saartaa gabagabo tirooyinku taageeraan — wax ka badan ma jiro.",
   ex:[{en:"Experiment: two cups of seeds, same soil, same water. Cup A in sunlight, Cup B in the dark. After 10 days: A = 9 cm, B = 3 cm.",so:"Tijaabo: laba koob oo abuur ah, isku ciid, isku biyo. Koob A cadceedda, Koob B mugdiga. 10 maalmood kadib: A = 9 cm, B = 3 cm."},{en:"Only the LIGHT was different, and A grew 6 cm more (9 − 3). Conclusion: these seeds grow better with light.",so:"Iftiinka oo keliya ayaa kala duwanaa, A waxuu koray 6 cm ka badan (9 − 3). Gabagabadu: abuurkani iftiin bay si fiican ugu koraan."}]}],
 examMin:20,
 exam:[
  {q:"Which gas do plants take from the air to make food?",qSo:"Gaaskee bay geeduhu hawada ka qaataan si ay cunto u sameeyaan?",o:["Carbon dioxide","Oxygen only at night","Hydrogen","Nitrogen from cars"],a:0,wEn:"Plants take in carbon dioxide and sunlight to make food (photosynthesis), and give out oxygen.",wSo:"Geeduhu waxay qaataan kaarboon laba-ogsaydh iyo cadceed si ay cunto u sameeyaan (photosynthesis), waxayna sii daayaan ogsijiin."},
  {q:"A bar of chocolate left in a hot car becomes soft and liquid. What happened?",qSo:"Shukulaato baabuur kulul lagu daayay way jilcaysaa waxayna noqotaa dareere. Maxaa dhacay?",o:["It melted — solid became liquid","It evaporated into a gas","It froze","It burned"],a:0,wEn:"Heat changed the solid chocolate into a liquid — that is melting.",wSo:"Kulaylku wuxuu shukulaatadii adagnayd u beddelay dareere — taasi waa dhalaalid."},
  {q:"Which is the best way to make a fair test of “do seeds grow faster in warm places?”",qSo:"Waa tee habka ugu fiican ee tijaabo cadaalad ah oo ah “abuurku ma si dhaqso ah u koraan meelaha diirran?”",o:["Two seed pots with the same soil, water and light — one warm, one cold","One pot warm with much water, one pot cold with no water","One pot in a garden, one pot in a fridge with different soil","Two pots both in the same warm place"],a:0,wEn:"A fair test changes ONE thing (the warmth) and keeps soil, water and light the same.",wSo:"Tijaabo cadaalad ahi waxay beddeshaa HAL shay (diirranaanta) waxayna haysaa ciidda, biyaha iyo iftiinka isku mid."},
  {q:"The Earth turning on its axis once every 24 hours gives us:",qSo:"Dhulku mar uu ku wareego dhidibkiisa 24 saacadood kasta waxay na siisaa:",o:["Day and night","The four seasons","The Moon's phases","Earthquakes"],a:0,wEn:"As Earth spins, different sides face the Sun — that makes day and night.",wSo:"Markuu Dhulku wareego, dhinacyo kala duwan baa Cadceedda wajaha — taasi waxay sameysaa maalin iyo habeen."},
  {q:"In the food chain — grass → rabbit → fox — which animal is a consumer that eats plants only?",qSo:"Silsiladda cuntada — caws → bakayle → dawaco — xayawaankee baa cune geedo oo keliya cuna?",o:["The rabbit","The fox","The grass","None of them"],a:0,wEn:"The rabbit eats the grass. The fox eats other animals, and the grass is the producer.",wSo:"Bakayluhu cawska buu cunaa. Dawacadu waxay cuntaa xayawaan kale, cawskuna waa soo-saaraha."},
  {q:"Which tool measures temperature?",qSo:"Qalabkee baa cabbira heerkulka (temperature)?",o:["A thermometer","A ruler","A balance scale","A magnet"],a:0,wEn:"A thermometer measures how hot or cold something is.",wSo:"Thermometer-ku wuxuu cabbiraa inta shay kulul yahay ama qabow yahay."},
  {q:"Rain falls, collects in a river, flows to the sea, and later rises as vapour. These steps are part of:",qSo:"Roobku wuu da'aa, wabiga buu ku ururaa, baddana wuu u qulqulaa, hadhowna uumi buu u kacaa. Tallaabooyinkani waxay ka mid yihiin:",o:["The water cycle","The rock cycle","A food chain","The phases of the Moon"],a:0,wEn:"Evaporation, condensation and rain moving water around Earth is the water cycle.",wSo:"Uumi-baxa, isku-ururinta iyo roobku biyaha ku wareejiya Dhulka waa wareegga biyaha."},
  {q:"A student measures a shadow at 9 am (long) and at 12 pm (short). Why did the shadow change?",qSo:"Arday wuxuu cabbirayaa hadh 9 subaxnimo (dheer) iyo 12 duhurnimo (gaaban). Maxaa hadhku isu beddelay?",o:["The Sun's position in the sky changed","The building grew taller","The ruler changed size","Shadows are always the same"],a:0,wEn:"The Sun moves across the sky during the day, so shadows change length and direction.",wSo:"Cadceeddu waxay ku socotaa cirka maalinta, sidaa darteed hadhku wuu is beddelaa dherer iyo jiho."},
  {q:"Which material lets electricity pass through it easily?",qSo:"Walaxdee bay korontadu si fudud u dhex martaa?",o:["Copper wire","A plastic ruler","A wooden spoon","A rubber glove"],a:0,wEn:"Metals like copper are conductors. Plastic, wood and rubber are insulators — they block electricity.",wSo:"Biraha sida naxaasta waa gudbiyeyaal. Balaastiigga, alwaaxa iyo caaggu waa horjoogayaal — korontada way joojiyaan."},
  {q:"A graph shows a car's speed rising, then staying the same, then falling to zero. The flat middle part means:",qSo:"Jaantus wuxuu muujinayaa xawaaraha baabuur oo koraya, kadib isku mid ahaanaya, kadib eber u dhacaya. Qaybta dhexe ee simman waxay macnaheedu tahay:",o:["The car moved at a steady speed","The car stopped","The car went backwards","The car used no fuel"],a:0,wEn:"A flat line on a speed graph means the speed did not change — steady speed.",wSo:"Khad simman oo jaantuska xawaaraha ahi wuxuu macnaheedu yahay xawaaruhu isma beddelin — xawaare joogto ah."},
  {q:"Which change helps a plant survive in a dry desert?",qSo:"Isbeddelkee baa caawiya geed inuu ku noolaado saxare qalalan?",o:["Thick leaves that hold water","Very big thin leaves","Growing only at night in winter","Needing rain every day"],a:0,wEn:"Desert plants store water in thick leaves or stems and lose very little water.",wSo:"Geedaha saxaraha waxay biyo ku kaydiyaan caleemo ama jirrid qaro weyn, biyo aad u yar baana ka baxa."},
  {q:"When you rub your hands together quickly, they feel warm. The energy changed from movement to:",qSo:"Markaad gacmahaaga si dhaqso ah isugu xoqdo, way diirranaadaan. Tamartu waxay dhaqdhaqaaq uga beddeshay:",o:["Heat","Light","Sound only","Electricity in a wire"],a:0,wEn:"Friction changes movement energy into heat — that is why your hands feel warm.",wSo:"Isku-xoqiddu waxay tamarta dhaqdhaqaaqa u beddeshaa kulayl — taasi waa sababta gacmuhu u diirranaadaan."}]},

 diagMin:15,
 diag:[
  {q:"The US government has three branches. Which branch MAKES the laws?",qSo:"Dowladda Mareykanku waxay leedahay saddex laamood. Laanteebaa SHARCIYADA samaysa?",o:["The legislative branch (Congress)","The executive branch (the President)","The judicial branch (the courts)","The police department"],a:0,wEn:"Congress — the Senate and the House — makes the laws. The President carries them out; the courts explain them.",wSo:"Congress — Senate iyo House — ayaa sharciyada sameeya. Madaxweynuhu wuu fuliyaa; maxkamaduhu way sharxaan."},
  {q:"What is the supreme law of the United States — the document all other laws must follow?",qSo:"Waa maxay sharciga ugu sarreeya Mareykanka — dukumeentiga sharciyada kale oo dhammi raacaan?",o:["The Constitution","The Declaration of Independence","A driver's handbook","The President's speeches"],a:0,wEn:"The Constitution is the supreme law. It was written in 1787 and still guides the government today.",wSo:"Dastuurku (Constitution) waa sharciga ugu sarreeya. Waxaa la qoray 1787 weli wuu hagaa dowladda maanta."},
  {q:"The first ten changes (amendments) to the Constitution are called:",qSo:"Tobanka isbeddel (amendments) ee ugu horreeya Dastuurka waxaa la yidhaahdaa:",o:["The Bill of Rights","The Articles of Confederation","The Federalist Papers","The Emancipation Proclamation"],a:0,wEn:"The Bill of Rights protects freedoms like speech, religion and fair trials.",wSo:"Bill of Rights wuxuu ilaaliyaa xorriyadaha sida hadalka, diinta iyo maxkamadayn cadaalad ah."},
  {q:"In the United States, who chooses the President?",qSo:"Mareykanka, yaa doorta Madaxweynaha?",o:["The citizens, by voting in an election","The Supreme Court","The army","The state governors together"],a:0,wEn:"Citizens vote in elections. Voting is the main way ordinary people guide their government.",wSo:"Muwaadiniintu waxay ku doortaan codbixin doorasho. Codbixintu waa jidka ugu weyn ee dadka caadiga ahi dowladahooda ku hagaan."},
  {q:"The American Civil War (1861–1865) was fought mainly over:",qSo:"Dagaalkii Sokeeye ee Mareykanka (1861–1865) wuxuu badanaa ku saabsanaa:",o:["Slavery and whether it would end","Who would be king of America","Trade with Britain only","Building railways in the West"],a:0,wEn:"The war was fought over slavery. It ended with slavery abolished — the 13th Amendment made it illegal.",wSo:"Dagaalku wuxuu ku saabsanaa addoonsiga. Wuxuu ku dhammaaday addoonsiga oo la baabi'iyay — Isbeddelka 13aad wuxuu ka dhigay sharci-darro."},
  {q:"Which ocean is on the WEST coast of the United States?",qSo:"Badweynteebaa ku taal xeerta GALBEED ee Mareykanka?",o:["The Pacific Ocean","The Atlantic Ocean","The Indian Ocean","The Arctic Ocean"],a:0,wEn:"The Pacific is on the west (California side); the Atlantic is on the east (New York side).",wSo:"Pacific-gu waa galbeedka (dhanka California); Atlantic-gu waa bariga (dhanka New York)."},
  {q:"If many people want to buy a toy and very few toys are in the shops, what usually happens to the price?",qSo:"Haddii dad badan ay rabaan inay alaab carruur iibsadaan oo alaab aad u yar dukaamada ku jirta, qiimuhu badanaa muxuu noqdaa?",o:["The price goes up","The price goes down","The price disappears","The price stays exactly the same always"],a:0,wEn:"When demand is high and supply is low, prices usually go up.",wSo:"Marka baahidu (demand) sarreyso oo sahaydu (supply) yar tahay, qiimuhu badanaa wuu kordhaa."},
  {q:"What is a “budget”?",qSo:"Waa maxay “miisaaniyad” (budget)?",o:["A plan for how to spend and save money","A kind of tax form only for banks","A list of voters","A map of a city"],a:0,wEn:"A budget is a plan: money coming in, money going out, and money saved.",wSo:"Miisaaniyaddu waa qorshe: lacag soo gasha, lacag baxda, iyo lacag kaydsan."},
  {q:"The judicial branch's highest court is called:",qSo:"Maxkamadda ugu sarreysa laanta garsoorka waxaa la yidhaahdaa:",o:["The Supreme Court","The Senate","The Cabinet","The City Council"],a:0,wEn:"The Supreme Court is the highest court. It decides if laws follow the Constitution.",wSo:"Maxkamadda Sare (Supreme Court) waa maxkamadda ugu sarreysa. Waxay go'aamisaa in sharciyadu Dastuurka raacsan yihiin."},
  {q:"Which of these is a responsibility of US citizens?",qSo:"Midkee baa ah waajibaadka muwaadiniinta Mareykanka?",o:["Obeying the law and paying taxes","Choosing the President alone","Writing laws by themselves","Never voting"],a:0,wEn:"Citizens must obey laws and pay taxes; voting is both a right and a responsibility.",wSo:"Muwaadiniintu waa inay sharciyada adeecaan oo cashuur bixiyaan; codbixintu waa xaq iyo waajibaad labadaba."}],
 lessons:[
  {id:"branches",tEn:"How US government works: three branches",tSo:"Sida dowladda Mareykanku u shaqeyso: saddex laamood",bEn:"Legislative (Congress) makes laws. Executive (the President and departments) carries out laws. Judicial (courts) explains laws and checks they follow the Constitution. Each branch can check the others — this balance stops one branch becoming too strong.",bSo:"Laanta sharci-dejinta (Congress) waxay samaysaa sharciyada. Laanta fulinta (Madaxweynaha iyo waaxyuhu) waxay fulisaa sharciyada. Laanta garsoorka (maxkamaduhu) waxay sharxdaa sharciyada waxayna hubisaa inay Dastuurka raacsan yihiin. Laan kastaa way hubin kartaa kuwa kale — isku-dheellitirkaani wuxuu joojiyaa laan aad u xoog badnaata.",
   ex:[{en:"Worked example: “Who can stop a new law?” Step 1: Congress makes the law.",so:"Tusaale la xalliyay: “Yaa joojin kara sharci cusub?” Tallaabada 1: Congress baa sharciga sameeya."},{en:"Step 2: The President can refuse to sign it (a veto). Step 3: The courts can later say the law breaks the Constitution.",so:"Tallaabada 2: Madaxweynuhu wuu diidi karaa saxeexa (veto). Tallaabada 3: Maxkamaduhu waxay hadhow dhihi karaan sharcigu Dastuurka buu jebiyay."}]},
  {id:"history",tEn:"US history basics: a short timeline",tSo:"Aasaaska taariikhda Mareykanka: khad waqti oo gaaban",bEn:"1776 — the Declaration of Independence says the colonies are free from Britain. 1787 — the Constitution is written. 1861–1865 — the Civil War ends slavery. 1920 — women win the right to vote. 1964 — the Civil Rights Act makes discrimination by race illegal in public life.",bSo:"1776 — Baaqa Madaxbannaanidu wuxuu yidhi gumeystayaashu waxay ka xoroobeen Britain. 1787 — Dastuurka waa la qoray. 1861–1865 — Dagaalkii Sokeeye wuxuu dhammeeyaa addoonsiga. 1920 — dumarku waxay ku guuleystaan xaqa codbixinta. 1964 — Sharciga Xuquuqda Madaniga ah wuxuu takoorka midabka ka dhigaa sharci-darro nolosha dadweynaha.",
   ex:[{en:"Worked example: Put in order — Civil War, Declaration of Independence, women vote. Answer: Declaration (1776) → Civil War (1861–65) → women vote (1920).",so:"Tusaale la xalliyay: Kala hagaaji — Dagaalkii Sokeeye, Baaqa Madaxbannaanida, codbixinta dumarka. Jawaabtu: Baaqa (1776) → Dagaalkii Sokeeye (1861–65) → codbixinta dumarka (1920)."}]},
  {id:"geoeco",tEn:"Geography and economics basics",tSo:"Aasaaska juqraafiga iyo dhaqaalaha",bEn:"Geography: the Atlantic Ocean is east, the Pacific is west, Canada is north, Mexico is south. Economics: prices move with supply (how much there is) and demand (how much people want it). A budget is a plan for money in, money out, and saving.",bSo:"Juqraafi: Badweynta Atlantic waa bari, Pacific waa galbeed, Canada waa woqooyi, Mexico waa koonfur. Dhaqaale: qiimuhu wuxuu la socdaa sahayda (inta jirta) iyo baahida (inta dadku rabaan). Miisaaniyaddu waa qorshe lacag soo gasha, lacag baxda, iyo kayd.",
   ex:[{en:"Worked example: Lemons — a storm destroys many lemon trees. Supply goes DOWN. Many people still want lemons. Price: goes UP.",so:"Tusaale la xalliyay: Liin — duufaan waxay baabi'isaa geedo liin oo badan. Sahaydu way HOOS u dhacdaa. Dad badan baa weli liin raba. Qiimuhu: wuu KORDHAA."}]}],
 examMin:20,
 exam:[
  {q:"Which branch of government explains laws and decides if they follow the Constitution?",qSo:"Laantee dowladeed baa sharciyada sharaxda oo go'aamisa inay Dastuurka raacsan yihiin?",o:["The judicial branch","The legislative branch","The executive branch","The military"],a:0,wEn:"The courts (judicial branch) explain laws and can stop laws that break the Constitution.",wSo:"Maxkamaduhu (laanta garsoorku) waxay sharxaan sharciyada waxayna joojin karaan sharciyada Dastuurka jebiya."},
  {q:"How long is a US President's term (one time in the job)?",qSo:"Imisa sano waa muddada Madaxweynaha Mareykanka (hal mar oo shaqada)?",o:["Four years","Two years","Six years","Eight years"],a:0,wEn:"A President's term is four years, and a person can be elected President at most twice.",wSo:"Muddada Madaxweynuhu waa afar sano, qofkana waxaa ugu badan laba jeer la dooran karaa Madaxweyne."},
  {q:"What does the First Amendment protect?",qSo:"Maxaa Isbeddelka Koowaad (First Amendment) ilaaliyaa?",o:["Freedom of speech and religion","The right to drive a car","Free houses for citizens","The President's powers"],a:0,wEn:"The First Amendment protects speech, religion, the press, and peaceful assembly.",wSo:"Isbeddelka Koowaad wuxuu ilaaliyaa hadalka, diinta, saxaafadda, iyo isu-imaatinka nabadeed."},
  {q:"In 1776, the American colonies declared independence from which country?",qSo:"1776, gumeystayaashii Mareykanku waxay madaxbannaani ka ku dhawaaqeen dalkee?",o:["Britain","France","Spain","Mexico"],a:0,wEn:"The Declaration of Independence (1776) declared freedom from Britain.",wSo:"Baaqa Madaxbannaanidu (1776) wuxuu ku dhawaaqay xorriyad ka dhan ah Britain."},
  {q:"A map shows a river flowing from the mountains to the sea. The high land where the river starts is in the west. The sea is in the east. Which way does the river flow?",qSo:"Khariidad waxay muujisaa webi ka qulqula buuraha ilaa badda. Dhulka sare ee webigu ka bilaabmo waa galbeedka. Baddu waa bariga. Webigu ujeedkee buu u qulqulaa?",o:["From west to east","From east to west","From north to south only","It does not flow"],a:0,wEn:"Rivers flow from high land to the sea — here, from the west to the east.",wSo:"Webiyadu waxay ka qulqulaan dhulka sare ilaa badda — halkan, galbeed ilaa bari."},
  {q:"What is “tax” money mainly used for?",qSo:"Lacagta “cashuurta” badanaa maxaa loogu isticmaalaa?",o:["Public services like roads, schools and police","Gifts for government workers","Only for the President's house","It is thrown away"],a:0,wEn:"Taxes pay for public services everyone uses: roads, schools, hospitals, police and more.",wSo:"Cashuuraha waxaa lagu bixiyaa adeegyada dadweynaha ee qof kasta isticmaalo: waddooyin, dugsiyo, isbitaallo, booliis iyo kuwo kale."},
  {q:"Which event happened FIRST?",qSo:"Dhacdadee baa marka hore DHACDAY?",o:["The Declaration of Independence (1776)","The Civil War (1861)","Women winning the vote (1920)","The Civil Rights Act (1964)"],a:0,wEn:"1776 is the earliest date — independence came before the Civil War and the later laws.",wSo:"1776 waa taariikhda ugu horreysa — madaxbannaanidu waxay ka horreysay Dagaalkii Sokeeye iyo sharciyada dambe."},
  {q:"If a factory makes MORE phones and fewer people want them, what usually happens to the price?",qSo:"Haddii warshad ay telefoono BADAN samayso oo dad yar ay rabaan, qiimuhu badanaa muxuu noqdaa?",o:["The price goes down","The price goes up","The price doubles","Nothing can change prices"],a:0,wEn:"High supply and low demand push prices DOWN — shops lower prices to sell the phones.",wSo:"Sahay badan iyo baahi yar waxay qiimaha ku riixaan HOOS — dukaamadu waxay qiimaha u dhimaan si telefoonnada loo iibiyo."},

function ensureStageF(st){if(!st||typeof st!=="object")return{best:{},wbOpened:false,lastSeen:""};if(!st.stageF||typeof st.stageF!=="object"||Array.isArray(st.stageF))st.stageF={best:{},wbOpened:false,lastSeen:""};if(!st.stageF.best||typeof st.stageF.best!=="object"||Array.isArray(st.stageF.best))st.stageF.best={};if(typeof st.stageF.wbOpened!=="boolean")st.stageF.wbOpened=!!st.stageF.wbOpened;if(typeof st.stageF.lastSeen!=="string")st.stageF.lastSeen="";return st.stageF}
function awardBestXP(key,points){if(typeof guestMode!=="undefined"&&guestMode)return 0;if(!S)return 0;ensureStageF(S);var pts=Math.max(0,Math.round(points||0));var prev=S.stageF.best[key]||0;if(pts<=prev)return 0;S.stageF.best[key]=pts;addActivity(pts-prev,0);return pts-prev}
function srsApplyGrade(c,g){var intervals=[1,3,7,16,35];if(g===0)c.box=0;else if(g===2)c.box=Math.min(4,c.box+2);else c.box=Math.min(4,c.box+1);c.due=Date.now()+intervals[c.box]*86400000;return c.box}

{id:"interviewtypes",en:"Types of job interviews — a guide",so:"Noocyada waraysiyada shaqada — hage",scene:"",npc:"Guide",npcSo:"Hage",introEn:"This guide explains five kinds of job interviews, with one practice line for each kind. For more practice, also do the \u201CJob interview basics\u201D role-play in this list and the Work and Jobs lessons (Lessons 81–90).",introSo:"Hagahani wuxuu sharxayaa shan nooc oo waraysiyo shaqo ah, mid kastaana wuxuu leeyahay khad tababar. Tababar dheeraad ah, sidoo kale samee door-ciyaarka \u201CAasaaska waraysiga shaqada\u201D ee liiskan ku jira, iyo cashirrada Shaqada (Cashirrada 81–90).",turns:[
 {n:"First: an in-person interview. You go to the workplace and meet the manager face to face. Try this line:",ns:"Koowaad: waraysi fool-ka-fool ah. Goobta shaqada ayaad tagtaa, maareeyahana fool ka fool baad u aragtaa. Khadkan isku day:",opts:[{e:"Good morning. Thank you for meeting me today.",s:"Subax wanaagsan. Waad ku mahadsantahay inaad maanta ila kulantay.",c:1},{e:"Meeting thank for you a morning good me.",s:"Kulan mahad adiga subax wanaagsan aniga.",w:"Salaanta furitaanka: GOOD MORNING. THANK YOU FOR MEETING ME TODAY.",we:"The opening greeting: GOOD MORNING. THANK YOU FOR MEETING ME TODAY."},{e:"I am a manager face to face today.",s:"Anigu maareeye fool ka fool maanta baan ahay.",w:"Maareeye ma tihid — adigu waa SHAQAALE doonaya. Salaan: Good morning. Thank you for meeting me.",we:"You are not the manager — you are the CANDIDATE. Greet: Good morning. Thank you for meeting me."}]},
 {n:"Second: a phone interview. The manager calls you on the phone. Speak slowly and clearly. Try this line:",ns:"Labaad: waraysi telefoon ah. Maareeyuhu telefoon buu ku soo wacaa. Tartii u hadal si cad. Khadkan isku day:",opts:[{e:"Hello, this is Ayaan. Thank you for calling me.",s:"Salaam, waa Ayaan. Waad ku mahadsantahay inaad i soo wacday.",c:1},{e:"Calling thank you this is a hello phone me.",s:"Wicitaan mahad adiga tani waa salaam telefoon aniga.",w:"Telefoonka: THIS IS + magacaaga. Hello, this is Ayaan.",we:"On the phone: THIS IS + your name. Hello, this is Ayaan."},{e:"I speak a phone slow manager call.",s:"Telefoon tartii maareeye wac baan ku hadlaa.",w:"Khadka tababarka dheh sidiisii: Hello, this is Ayaan. Thank you for calling me.",we:"Say the practice line as it is: Hello, this is Ayaan. Thank you for calling me."}]},
 {n:"Third: a video interview. You talk on a phone or computer camera. Look at the camera, not the floor. Try this line:",ns:"Saddexaad: waraysi muuqaal ah. Telefoon ama kombiyuutar kamaradiisa ayaad ku hadashaa. Kamaradda fiiri, sagxadda ma aha. Khadkan isku day:",opts:[{e:"Hello, can you hear me well?",s:"Salaam, si fiican ma ii maqashaan?",c:1},{e:"Hear you can me a hello camera well?",s:"Maqal aad kartaa aniga salaam kamarad fiican?",w:"Su'aashu waa: CAN YOU HEAR ME WELL? — si fiican ma ii maqashaan?",we:"The question is: CAN YOU HEAR ME WELL?"},{e:"I look at the floor camera video.",s:"Sagxadda kamarad muuqaal baan fiiriyaa.",w:"Sagxadda ma fiirinaysid — KAMARADDA fiiri, kadib weydii: Can you hear me well?",we:"Do not look at the floor — look at the CAMERA, then ask: Can you hear me well?"}]},
 {n:"Fourth: a panel interview. Two or three people ask you questions together. Look at each person when you answer. Try this line:",ns:"Afraad: waraysi guddi ah. Laba ama saddex qof ayaa su'aalo ku wada weydiiya. Qof kasta fiiri markaad jawaabayso. Khadkan isku day:",opts:[{e:"Good morning, everyone. My name is Ayaan.",s:"Subax wanaagsan, dhammaantiin. Magacaygu waa Ayaan.",c:1},{e:"Everyone morning good a name my is Ayaan people.",s:"Dhammaan subax wanaagsan magac kayga waa Ayaan dad.",w:"Guddiga salaam: GOOD MORNING, EVERYONE. MY NAME IS...",we:"Greet the panel: GOOD MORNING, EVERYONE. MY NAME IS..."},{e:"I answer three people questions a panel book.",s:"Saddex qof su'aalo guddi buug baan ka jawaabaa.",w:"Buug halkan ma jiro. Is baro: Good morning, everyone. My name is Ayaan.",we:"No book here. Introduce yourself: Good morning, everyone. My name is Ayaan."}]},
 {n:"Fifth: a group interview. Many job seekers are together, and the manager watches how you work with other people. Try this line:",ns:"Shanaad: waraysi kooxeed ah. Shaqo-dooneyaal badan ayaa wada jooga, maareeyuhuna wuxuu fiiriyaa sidaad dadka kale ula shaqayso. Khadkan isku day:",opts:[{e:"Hello, my name is Ayaan. I like to work with a team.",s:"Salaam, magacaygu waa Ayaan. Koox la shaqayn waan jeclahay.",c:1},{e:"Team work I like a name hello my group.",s:"Koox shaqo anigu jeclahay magac salaam kayga koox.",w:"Habka: MY NAME IS... I LIKE TO WORK WITH A TEAM.",we:"Pattern: MY NAME IS... I LIKE TO WORK WITH A TEAM."},{e:"I watch other people work a manager group.",s:"Dad kale shaqo maareeye koox baan fiiriyaa.",w:"MAAREEYAHA ayaa fiiriya — adigu kooxda la SHAQEE: I like to work with a team.",we:"The MANAGER watches — you WORK WITH the group: I like to work with a team."}]},
 {n:"Good. Now you know five kinds of interviews: in-person, phone, video, panel, and group.",ns:"Wanaagsan. Hadda waxaad taqaan shan nooc oo waraysi: fool-ka-fool, telefoon, muuqaal, guddi, iyo kooxeed.",opts:[{e:"Thank you. I will practise each kind again.",s:"Mahadsanid. Nooc kasta mar kale baan ku tababaran doonaa.",c:1},{e:"Practise I will a thank kinds five each.",s:"Tababar anigu doonaa mahad noocyo shan kasta.",w:"Xiritaanka: THANK YOU. I WILL PRACTISE EACH KIND AGAIN.",we:"The closing: THANK YOU. I WILL PRACTISE EACH KIND AGAIN."},{e:"I know five interviews a group book phone.",s:"Shan waraysi koox buug telefoon baan aqaanaa.",w:"Buug ma jiro — ballanqaad tababar: I will practise each kind again.",we:"No book — promise to practise: I will practise each kind again."}]}]},
