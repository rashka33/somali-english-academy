<style>

*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:130px;scroll-padding-bottom:110px}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
a{color:var(--teal)}button,input,textarea,select{font:inherit}
:focus-visible{outline:3px solid var(--amber2);outline-offset:2px;border-radius:8px}
.topbar{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px}
.brand{font-weight:900;letter-spacing:-.02em;font-size:19px}.brand span{color:var(--teal)}.brand small{display:block;font-weight:600;color:var(--muted);font-size:12px;letter-spacing:0}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border:1px solid var(--line);padding:6px 10px;border-radius:999px;font-size:13px;font-weight:700}
.btn{min-height:52px;padding:12px 18px;border-radius:14px;border:1px solid var(--teal);background:var(--teal);color:#fff;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.secondary{background:var(--card);color:var(--teal)}.btn.amber{background:var(--amber);border-color:var(--amber)}.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}.btn:disabled{opacity:.5;cursor:not-allowed}
.iconbtn{min-width:48px;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:18px}
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 40px}
.grid{display:grid;gap:14px}.grid2{grid-template-columns:1fr}.grid3{grid-template-columns:1fr}
@media(min-width:760px){.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr 1fr 1fr}.wrap{padding-bottom:32px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.card h2,.card h3{margin:.1em 0 .4em;line-height:1.2}.muted{color:var(--muted)} .small{font-size:13px}
.hero{background:linear-gradient(135deg,#083f66,#0e7c86);color:#fff;border-radius:22px;padding:22px}
.hero h1{font-size:30px;line-height:1.05;margin:.1em 0}.hero p{opacity:.92}
.progress{height:12px;background:rgba(0,0,0,.12);border-radius:999px;overflow:hidden;background:var(--line)}.progress i{display:block;height:100%;background:var(--amber2)}
.hero .progress{background:rgba(255,255,255,.25)}
.kpi{display:flex;gap:10px;flex-wrap:wrap}.kpi div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:88px}.kpi b{font-size:20px;display:block}
.nav{position:sticky;top:57px;z-index:15;background:var(--card);border-bottom:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px}
.nav button{flex:1;min-height:54px;border:0;background:transparent;cursor:pointer;font-weight:700;font-size:12px;color:var(--muted);border-radius:12px}.nav button.active{color:var(--teal);background:var(--soft)}
@media(min-width:860px){.nav{position:sticky;top:57px;bottom:auto;justify-content:flex-start;gap:6px;padding:8px 16px;border-bottom:1px solid var(--line);border-top:0}.nav button{flex:0 0 auto;padding:8px 14px;font-size:14px}}
label{font-weight:700;display:block;margin:12px 0 6px}input[type=text],textarea,select{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:52px}

.dialogue{background:var(--soft);border-radius:14px;padding:14px}.dialogue p{margin:.4em 0}
.badge{display:inline-block;padding:7px 10px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-weight:700;font-size:13px;margin:3px}
.bar-row{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:10px}.bar-col{flex:1;text-align:center;font-size:11px}.bar-col i{display:block;background:var(--teal);border-radius:8px 8px 0 0;min-height:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
details{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card)}summary{font-weight:800;cursor:pointer;min-height:32px}
.hidden{display:none!important}
.wordchips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
:root[data-theme="dark"]{--ink:#eef6fa;--muted:#c3d3dd;--bg:#0a1620;--card:#122633;--line:#2b4557;--soft:#14342a}

html.largetext body{font-size:18.5px}html.largetext .small{font-size:15px}html.largetext .nav button{font-size:14px}

["Past simple in depth: journeys","Past simple si qoto dheer: safarro","Safarka waxaad ku sheegtaa past simple: went, stayed, visited, took. Su'aasha DID baa lagu sameeyaa: Did you travel by bus? WAS/WERE xaalad iyo meel: The hotel was clean, we were happy. Khaladka caadiga ah: 'did went' waa khalad — Did you GO? baa sax ah."],
["Present perfect intro: already and yet","Present perfect hordhac: already iyo yet","Present perfect = HAVE/HAS + falka qaabkiisa tegay (booked, been, done). ALREADY waxay sheegtaa wax hore u dhacay: I have already booked. YET waxay timaadaa su'aalaha iyo diidmada dhamaadka jumladda: Have you booked yet? I have not booked yet."],
["Past continuous intro","Past continuous hordhac","Past continuous = WAS/WERE + fal + -ing: I was walking home. Waxaa loo isticmaalaa fal socday oo fal kale oo gaaban jaray: I was walking when the bus came. WHEN ka hor fal gaaban, WHILE ka hor -ing."],
["Comparatives and superlatives in depth","Isbarbardhig iyo heerka sare si qoto dheer","Isbarbardhig: bigger than, cheaper than, more expensive than. Heerka sare: the biggest, the cheapest, the most expensive — mar walba THE baa ka horreeya. Qaabab gaar ah: good→better→the best, bad→worse→the worst."],
["Quantifiers: much, many, a few, a little","Tiraabka: much, many, a few, a little","MANY oo FEW waxay la socdaan wax la tiriyo (many people, a few friends). MUCH oo LITTLE waxay la socdaan wax aan la tirin (much help, a little time). A FEW / A LITTLE waxay ka dhigan yihiin 'wax yar laakiin ku filan' — waa macne togan."],
["Modals: should, must, mustn't","Should, must, mustn't","SHOULD waa talo: You should rest. MUST waa waajib xoog leh: You must take this medicine. MUSTN'T waa mamnuuc: You mustn't smoke here. Saddexdan kadib falka qaabkiisa koowaad baa yimaada, -s la'aan: he should go (ma aha goes)."],
["Present perfect: ever and never","Present perfect: ever iyo never","EVER waxay ku timaadaa su'aasha khibradda nolosha: Have you ever visited Chicago? NEVER waxay ka dhigan tahay 'waligay ma': I have never missed a class. Qaabab tegay oo muhiim ah: been, seen, done, read, written."],
["Will for offers, decisions and job talk","Will: dalabyo, go'aanno iyo hadalka shaqada","WILL waxaa loo isticmaalaa go'aan hadda la gaadhay, ballan iyo dalab: I will call you today. I will help you with the form. Wareysiga shaqada: I will arrive on time, I will work hard. WILL kadib falka qaabkiisa koowaad."],
["Present perfect: for and since","Present perfect: for iyo since","FOR waxay la socotaa muddo: for three years, for two weeks. SINCE waxay la socotaa bilowga waqtiga: since 2022, since Monday. We have lived here for two years = weli waan degganahay halkan."],
["Imperatives and recipe quantities","Amarada iyo tirada cuntada","Hab-cuntada amar baa lagu qoraa: Peel the onions, then chop them. Tirada: a cup of flour, two teaspoons of sugar, a little oil. Habaynta tallaabooyinka: first, then, next, after that, finally."],
["First conditional intro","Shuruudda koowaad: hordhac","Shuruudda koowaad = IF + present simple, kadib WILL + fal: If it rains, we will stay home. Waxay sheegtaa xaalad suurtagal ah mustaqbalka. Khalad caadi ah: 'if it will rain' waa khalad — if kadib present simple baa yimaada."],
["Money verbs and comparing value","Falalka lacagta iyo isbarbardhigga qiimaha","Falal lacageed: SAVE (kaydso), SPEND (kharash garee), PAY (bixi), SEND (dir), COST (qiimihiisu yahay). Isbarbardhig qiime: This phone is cheaper but that one is better value. The most useful thing is not always the cheapest."],
["Will vs going to","Will iyo going to","GOING TO waa qorshe hore loo go'aamiyay: I am going to visit my sister on Saturday. WILL waa go'aan degdeg ah oo hadalka waqtigiisa la gaadhay, ballan ama dalab: Watch out! You will fall. I will carry your bag."],
["Email and form language","Luuqadda iimaylka iyo foomamka","Iimayl edeb leh: ku bilow Dear..., ujeedda sheeg: I am writing to ask about..., codsi edeb leh: Please could you...?, ku dhammee: Thank you for your help. Best wishes. Foomamka: magaca oo buuxa, taariikhda dhalashada (month/day/year), cinwaanka — si sax ah oo cad u qor."],
["Mixed A2 grammar review","Dib-u-eegis naxwe A2 isku dhafan","A2 oo dhan mid mid waqtigiisa: past simple sheeko dhacday, past continuous fal socday, present perfect khibrad iyo 'wali' (yet/already), will iyo going to mustaqbalka, comparatives isbarbardhig, quantifiers tiraab, should/must talo iyo waajib, first conditional shuruud suurtagal ah."]

["Passive voice intro: present and past","Passive: hordhac — hadda iyo tegay","Passive = BE + falka qaabkiisa saddexaad: The helmets ARE checked every week (hadda), the report WAS written yesterday (tegay). Passive-ga waxaa la isticmaalaa marka qofkii sameeyay aan la aqoon, aan muhiim ahayn, ama aan iska cad ahayn. Shaqada iyo badbaadada waa meelaha ugu badan: Safety boots must be worn = kabaha badbaadada waa in la xirtaa. Waxa la sameeyay ayaa jumladda ka horreeya, samayuhuna by kadib waa la dhaafi karaa."],
["Polite emails and present perfect updates","Iimayllo edeb leh iyo cusbooneysiinta present perfect","Iimayl rasmi ah oo edeb leh: ku bilow Dear..., ujeedda hore u sheeg: I am writing to ask about..., wixii dhammaaday present perfect ku sheeg: I have attached the form, I have completed every section. Codsi edeb leh: Please could you...? Ku dhammee: Thank you for your help. I look forward to your reply. Present perfect waxay halkan sheegtaa: shaqadu waa dhammaatay, faylku waa diyaar, hadda adiga ayaa wax ka qaban kara."],
["Reported speech intro: said and told","Hadal la soo sheegay: hordhac — said iyo told","Hadalka qof kale marka aad soo sheegto: SHE SAID (THAT)... ama SHE TOLD ME (THAT)... Waqtigu inta badan hal tallaabo ayuu dib u noqdaa: 'I will call you' → she said she would call me. 'The office is closed' → he told me the office was closed. SAY qof looma baahna ka dib, TELL-se wuu u baahan yahay: told me, told us, told the teacher. THAT hadalka maalinlaha ah waa la dhaafi karaa."],
["Opinions and linking words: because, so, however","Fikrado iyo erayo xiriiriye: because, so, however","Fikrad sheegid: IN MY OPINION..., I THINK THAT..., I AGREE / I DISAGREE. BECAUSE waxay bixisaa sababta: I agree because it helps children. SO waxay sheegtaa natiijada: It is cheap, so many families use it. HOWEVER waxay keentaa fikrad ka soo horjeeda, si edeb leh: I see your point. However, buses are already full. Qaabkani waa laf-dhabarta doodaha B1: fikrad → sabab → tusaale → gabagabo."],
["Past perfect intro: had done","Past perfect: hordhac — had done","Past perfect = HAD + falka qaabkiisa saddexaad (had left, had finished, had eaten). Waxaa loo isticmaalaa labo fal oo labadooduba tegey midkii HORE u dhacay: She had left before I arrived. Sheekada: past simple waa falalka ugu waaweyn, past continuous waa muuqaalka gadaale, past perfect waa wixii intaas ka horreeyay. Calaamadaha: before, when, after, by the time."],
["Second conditional: if I had, I would","Shuruudda labaad: if I had, I would","Shuruudda labaad = IF + past simple, kadib WOULD + falka qaabkiisa koowaad: If I had more time, I would study every day. Waxay sheegtaa xaalad KHAYAALI ah ama aan hadda run ahayn — waqtigu waa hadda, laakiin qaabku waa tegay. Talo gaar ah: IF I WERE YOU, I WOULD... = haddaan adiga ahaan lahaa, waxaan... BE halkan mar walba waa WERE: If I were rich, if she were here."],
["First vs second conditional; when, as soon as, unless","Shuruudda koowaad iyo labaad; when, as soon as, unless","Shuruudda koowaad waa wax SUURTUGAL ah: If it rains tomorrow, we will stay home (if + present, will). Shuruudda labaad waa KHAYAALI: If it rained every day, I would buy a boat (if + past, would). WHEN iyo AS SOON AS kadib present simple baa yimaada xataa haddii macnuhu mustaqbal yahay: As soon as I get home, I will call you — 'will get' waa khalad. UNLESS macnaheedu waa 'haddii aan... ahayn': Unless the bus comes, we will walk."],
["Health modals and asking how long","Modals caafimaad iyo weydiinta muddada","SHOULD iyo OUGHT TO waa talo: You should rest. HAD BETTER waa talo ka xoog badan oo digniin leh: You had better see a doctor today (haddii kale dhib baa iman kara). MUST waa waajib. Muddada astaamaha waxaa lagu weydiiyaa present perfect: HOW LONG HAVE YOU HAD this pain? Jawaab: I have had it FOR three days / SINCE Monday. Dhakhtarku mar walba wuxuu weydiiyaa: goorma ayay bilaabatay, meeday ku xanuunaysaa, daawo ma qaadatay?"],
["Passive past for travel problems","Passive-ga tegay ee dhibaatooyinka socdaalka","Dhibaatooyinka socdaalka passive-ga tegay baa lagu sheegaa — WAS/WERE + falka saddexaad: The flight WAS delayed, our bags WERE lost, the train WAS cancelled. Sababtu waa in qofkii sameeyay aan la aqoon ama aanu muhiim ahayn; waxa muhiim ah waa wixii kugu dhacay iyo waxa xiga: When will a new ticket be issued? Keep your receipts = rasiidhyadaada hayso, sababtoo ah caymisku wuu u baahan yahay."],
["Phrasal verbs core set: money and everyday life","Falal xiriir leh: xirmo aasaasi ah — lacag iyo nolol maalmeed","Fal xiriir leh = fal + hormood yar (up, back, out, aside), macnahuna wuu is beddelaa: SAVE UP = si tartiib ah u kaydso ilaa hadaf, PAY BACK = amaah dib u bixi, TAKE OUT = lacag bangi ka bixi, PUT ASIDE = lacag gees u dhig, RUN OUT OF = wax kaa dhammaadaan. Ha turjumin eray eray — fal kasta sida cutub dhan u baro, tusaale dhab ahna ku xafid: I am saving up for a course."],
["Relative clauses: who, which, that, where","Relative clauses: who, which, that, where","Relative clause waxay faahfaahin ku dartaa magac: WHO dadka (the teacher who helped me), WHICH waxyaabaha (the book which I bought), WHERE meelaha (the school where my children learn), THAT labadaba waa loo isticmaali karaa. Jumlada yar waa inay isla markiiba raacdaa magaca ay qeexayso. Tani waxay kuu oggolaanaysaa inaad laba jumlo oo gaagaaban mid dheer oo cad ka dhigto — xirfad muhiim u ah B1."],
["Reported speech in the news","Hadal la soo sheegay wararka ku jira","Wararka inta badan waa hadal la soo sheegay: weriyuhu wuxuu gudbiyaa hadalka dadka kale. 'The road is closed,' the police said → The police said that the road WAS closed. Erayada waqtiga way is beddelaan: today → that day, tomorrow → the next day, here → there. SAY iyo TELL farqigoodii waa sidii hore: told US, told ME — tell wuxuu u baahan yahay qof. Cinwaannadu (headlines) se waa present simple gaaban: 'Road Closed After Storm'."],
["Used to for past habits and states","Used to: caadooyin iyo xaalado tegey","USED TO + falka qaabkiisa koowaad waxay sheegtaa caado ama xaalad TEGAY oo hadda is beddeshay: We used to live in a small village (hadda ma deggannaan). Diidmo: We DIDN'T USE TO have a car. Su'aal: DID you USE TO walk to school? Feejignaan: BE USED TO (la qabsaday) waa qaab kale oo heer kale ah — ha isku khaldin labada. Used to waxay ku fiican tahay sheekooyinka isbeddelka nolosha."],
["Modals of deduction intro: must be, can't be, might be","Modals of deduction: hordhac — must be, can't be, might be","Marka aad calaamadaha ka MALAYNAYSO waxa dhacay ama run ah: MUST BE = hubaa waa (calaamad xoog leh): He must be tired — he worked all night. CAN'T BE = suurtagal ma aha: It can't be midnight already! MIGHT BE / COULD BE = laga yaabaa (calaamad daciif ah): She might be at the clinic. Saddexdan kadib BE baa yimaada xaaladaha, falka qaabkiisa koowaad ficilada: He must WORK nights = waa inuu habeenkii shaqeeyo malahayga."],
["Interview answers: present perfect, then past simple","Jawaabaha wareysiga: present perfect, kadib past simple","Qaabka jawaabta xooggan ee wareysiga: marka hore KHIBRADDA present perfect ku fur — Have you ever worked in a team? Yes, I have. Kadib TUSAALE DHAB AH past simple ku bixi — I worked in a busy shop in 2023 and I helped new staff every week. Marna been ha sheegin: 'I have never done that job, but I have done similar work and I learn quickly' waa jawaab daacad ah oo xoog leh. Ugu dambayn su'aal caqli leh weydii wareysiiyaha."],
["Presentation language: signposting and charts","Luuqadda bandhigga: habayn iyo jaantusyo","Bandhig cad wuxuu leeyahay calaamado (signposts): furitaanka — Today I am going to talk about...; habaynta — Firstly..., Secondly..., Finally...; jaantusyada — The chart shows that..., Most families spend...; isbarbardhigga — more than, less than, the biggest cost is...; xiritaanka — To sum up..., Thank you. Do you have any questions? Tartib u hadal, bog kasta hal fikrad, dhagaystayaasha eeg — luqadda fudud ee habaysan waa tan ugu xooggan."],
["Relative clauses in depth: whose, when, where","Relative clauses si qoto dheer: whose, when, where","Heerkan: WHOSE wuxuu sheegaa lahaansho — a neighbour WHOSE cooking is famous (deris cuntadiisu caan tahay). WHEN wuxuu qeexaa waqti — the day when we arrived. WHERE meel — the hall where we celebrate. Khaladka ugu caadsan: erayga xiriiriyaha iyo magaca oo la kala fogeeyo: 'the hall we celebrate where' waa khalad. Marka qofka ama shaygu yahay MAQALKII (object) jumlada yar, who/which waa la dhaafi karaa: The food (which) we cooked was delicious."],
["Phrasal verbs for solving problems","Falal xiriir leh oo dhibaato xallin ah","Falalkan xallinta: SORT OUT = xalli oo hagaaji (sort out a problem), WORK OUT = xalka maskaxda ku hel (work out what happened), FIND OUT = xog ogoow (find out the reason), DEAL WITH = la macaamil (deal with a difficult neighbour), COME UP WITH = fikrad la imow (come up with a plan), CARRY ON = sii wad, PUT OFF = dib u dhig. Dhibaato kasta: marka hore FIND OUT sababta, kadib COME UP WITH qorshe, ugu dambayn SORT OUT."],
["Mixed B1 grammar review","Dib-u-eegis naxwe B1 isku dhafan","B1 oo dhan, mid kasta waqtigiisa: present perfect (khibrad, muddo for/since, natiijo hadda), past perfect (falkii hore ee labo tegay), shuruudda koowaad (suurtagal: if+present, will) iyo labaad (khayaali: if+past, would), passive hadda iyo tegay (is/was + saddexaad), hadal la soo sheegay (said/told + waqti dib u noqda), relative clauses (who/which/where/whose), used to (caado tegey), modals of deduction (must/can't/might be), iyo phrasal verbs xirmadooda. Waqtiga iyo macnaha ayaa go'aamiya qaabka — qaabka oo keliya ma aha."]
];

["Reported speech in depth: questions, requests and orders","Hadal la soo sheegay si qoto dheer: su'aalo, codsiyo iyo amarro","Heerkan hadalka la soo sheegay wuu sii qoto dheeraadaa. Su'aalaha YES/NO waxaa lagu soo sheegaa ASKED IF ama WHETHER: Can you start in June? waxay noqotaa: She asked whether I could start in June. Su'aalaha WH- sidoo kale: What experience do you have? waxay noqotaa: He asked what experience I HAD — qaabku waa qaab jumlo caadi ah, su'aal ma aha: what I had, ee ma aha what did I have. Codsiyada iyo amarrada: TOLD ama ASKED + qof + TO + fal: Bring your documents waxay noqotaa: They told me TO bring my documents. Waqtigu hal tallaabo ayuu dib u noqdaa: can waxay noqotaa could, will-na would, present-na past."],
["Discourse markers and linking language in depth","Erayada xiriirinta iyo luqadda isku-xirka si qoto dheer","Bandhig iyo dood wanaagsan erayo xiriiriye oo sax ah bay u baahan yihiin. Kuwa fikrado isku mid ah ku dara: FURTHERMORE, MOREOVER (intaas waxaa dheer, sidoo kale). Kuwa fikrad ka soo horjeeda keena: HOWEVER, NEVERTHELESS, DESPITE THIS (si kastaba ha ahaatee). Kuwa natiijada sheega: CONSEQUENTLY, AS A RESULT (sidaas darteed). Kuwa tusaalaha bixiya: FOR INSTANCE (tusaale ahaan). Kuwa habaynta: FIRSTLY, TURNING TO..., FINALLY. Xeer qoraal: eray xiriiriye cusub kadib inta badan hakad (comma) baa yimaada, jumladduna waa inay macno buuxa yeelataa. Hadalkaaga haddii aad kuwan si sax ah u isticmaasho, dhagaystuhu wuu ku raaci karaa tallaabo tallaabo."],
["Formal and informal register in depth","Habka rasmiga ah iyo kan aan rasmiga ahayn si qoto dheer","REGISTER waa heerka edebta luqadda, goobtuna waa tan go'aamisa. Rasmi ah: I am writing to enquire about... iyo I would be grateful if you could.... Aan rasmi ahayn: Just wanted to ask... iyo Can you...? Kala duwanaanshuhu wuxuu ka muuqdaa erayada (enquire waxay ka rasmi santahay ask, receive-na get), isku-darka erayada oo laga fogaado qoraalka rasmiga ah (do not, ee ma aha don't), furitaanka (Dear Sir or Madam) iyo xiritaanka (Yours faithfully). Shaqada, golaha iyo isbitaalka: rasmi. Saaxiibka iyo qoyska: aan rasmi ahayn. Labada oo la isku dhex milaa waa khaladka ugu caadsan ee heerka B2."],
["Third conditional: if + past perfect, would have","Shuruudda saddexaad: if + past perfect, would have","Shuruudda saddexaad waxay ka hadashaa waagii tegay oo aan dib loo beddeli karin: IF + past perfect (had + qaabka saddexaad), kadib WOULD HAVE + qaabka saddexaad: If the bus HAD COME, we WOULD HAVE ARRIVED on time. Macnuhu waa cad yahay: basku ma iman, mana aannaan gaarin waqtigii — labaduba waa xaqiiq tegay, waxaanan maleeynaa sida kale ee ay noqon lahaayeen. Doodaha waxaa loo isticmaalaa go'aanno hore: If leaders had listened, the problem would have been smaller. Khalad caadi ah: if I would have known waa khalad — qaybta if kadib waa HAD KNOWN oo keliya."],
["Passive voice in depth: all tenses","Passive si qoto dheer: waqtiyada oo dhan","Passive-gu waa BE + falka qaabkiisa saddexaad, BE-na waqtiga ayay beddeshaa: IS BUILT (hadda), IS BEING BUILT (hadda oo socda), WAS BUILT (tegay), HAS BEEN BUILT (present perfect), WILL BE BUILT (mustaqbal). Wararka iyo warbixinnada passive-gu waa luqadda ugu caadsan: The results have been announced. A new library is being built. Sababtu waa in wixii dhacay ay ka muhiimsan yihiin cidda samaysay, ama aan cidda la aqoonba. Su'aasha passive-ga: HAS the road BEEN repaired yet? Diidmada: The form HAS NOT BEEN sent yet. Cashir kasta oo B2 ah, waqtiga BE ayaa sheega xilliga, falka saddexaadna ficilka."],
["Impersonal passive: it is believed, is expected to","Passive aan qof lahayn: waxaa la aaminsan yahay, waxaa laga filayaa","Ganacsiga, wararka iyo qoraalka rasmiga ah waxaa badiya qaabkan: IT IS BELIEVED THAT prices will rise — waxaa la aaminsan yahay in qiimuhu kici doono. Ama qofka ama shayga ayaa jumladda bilaaba: The company IS EXPECTED TO hire more staff. Qaabab kale oo muhiim ah: IT IS SAID THAT..., IT HAS BEEN AGREED THAT..., IT IS REPORTED THAT.... Macnuhu mar walba waa: dad badan ama ilo rasmi ah ayaa sidaas yiri, laakiin hadalka qof gaar ah looma nisbeeyo. Tani waa luqad taxaddar leh oo aan ballanqaad toos ah samayn — ganacsiga iyo warbaahinta labadaba waa muhiim."],
["Academic basics: paraphrasing and summarising","Aasaaska aqooneed: erayo kale ku celin iyo soo koobid","PARAPHRASING waa macnihii oo erayadaada lagu soo celiyo: qaab-dhismeedka beddel, erayada beddel, macnaha ha beddelin. Many families cannot afford the new fees waxay noqon kartaa: The new fees are too expensive for a lot of families. SUMMARISING waa soo koobid: fikradda ugu weyn oo keliya soo qaado, tusaalooyinka iyo faahfaahinta ka tag. Labada xirfadoodba waxay u baahan yihiin in isha la sheego: According to the article.... Inaad qoraal eray-eray u nuqulato adigoo aan xigasho dhigin waa qalad aqooneed; paraphrase sax ah waa xirfad la barto, ma aha khiyaamo."],
["Participle clauses intro: having done, written by","Jumlado participle: hordhac — having done, written by","Participle clause waxay laba jumlo mid gaaban oo qurxoon ka dhigtaa. Qaabka -ING: Walking home, I heard my name — markaan guriga u socday. HAVING + qaabka saddexaad waxay sheegtaa fal hore u dhammaaday: Having checked the figures, we sent the report. Qaabka saddexaad keligiis waa passive gaaban: Written by the team, the report was clear — warbixinta oo kooxdu qortay. Qoraalka rasmiga ah iyo warbixinnadu waa meelaha ugu badan. Xeer muhiim ah: qofka jumladda yar sameeyay waa inuu yahay qofka jumladda weyn: Having listened to residents, WE recommend... — annaga ayaa dhagaysannay, annaga ayaa talinayna."],
["Mixed conditionals: past cause, present result","Shuruudo isku dhafan: sabab tegay, natiijo hadda","Shuruudda isku dhafan waxay isku xirtaa waqtiyo kala duwan. Nooca ugu caadsan: sabab TEGAY iyo natiijo HADDA: IF + past perfect, kadib WOULD + falka qaabkiisa koowaad: If you HAD BOOKED earlier, you WOULD BE flying now — ma aadan ballansan, hadda ma duulaysid. Nooca kale: xaalad guud oo hadda jirta iyo natiijo tegay: If I WERE braver, I WOULD HAVE SPOKEN at the meeting. Shaqada iyo nolosha, qoomamooyinka dhabta ahi waa kuwan: go'aankii tegay ayaa kan hadda ku saameeya. Wada-xaajoodka, qaabkani wuxuu kaa caawiyaa inaad si edeb leh u tustaa waxa is beddeli lahaa."],
["Inversion intro: never have I, not only did she","Inversion: hordhac — never have I, not only did she","Inversion waa qaab erayada jumladda la isku beddelo si xoog loo saaro; hadalka dadweynaha iyo qoraalka rasmiga ah ayaa ugu badan. Marka eray taban uu jumladda bilaabo, falka caawiyaha iyo qofku way is beddelaan: NEVER HAVE I spoken to so many people. NOT ONLY DID SHE finish, she also helped others. RARELY DO WE get this chance. ONLY BY LISTENING CAN WE lead well. Qaabkani waa calaamad heerka B2 — laakiin si taxaddar leh u isticmaal: hadal kasta inversion ha ka buuxin; hal ama laba meel oo xoog leh ayaa ka waxtar badan toban daciif ah."],
["Advanced modals: speculation about the past","Modals sare: male ku saabsan waagii tegay","Marka aad caddaymo ka malayso wax tegay: MUST HAVE + qaabka saddexaad waa hubanti xoog leh: The app MUST HAVE CRASHED — calaamadaha oo dhan waa sidaas. CAN'T HAVE waa suurtagal ma aha inuu dhacay: It CAN'T HAVE BEEN the Wi-Fi — it works now. MIGHT ama COULD HAVE waa laga yaabaa: Someone MIGHT HAVE CHANGED the password. Qaabku mar walba waa modal + HAVE + qaabka saddexaad, xataa haddii modal-ku u eg yahay mid hadda. Tiknoolajiyada, xallinta dhibaatooyinka iyo nolosha maalinlaha ahba, luqaddani waa mid aad u faa'iido badan."],
["Wish and if only: present wishes and past regrets","Wish iyo if only: waxaan jeclahay hadda iyo qoomamo tegay","WISH iyo IF ONLY kadib qaabku hal tallaabo ayuu dib u noqdaa. Rabitaan HADDA: I wish our street HAD more trees — hadda ma laha. Rabitaan mustaqbal ama cabasho caado: I wish the buses WOULD RUN more often. Qoomamo TEGAY: If only I HAD BROUGHT an umbrella — ma keenin, waan qoyay. IF ONLY waa WISH ka xoog badan oo dareen badan. Khalad caadi ah: I wish I would have... waa khalad marka rabitaanku naftaada ku saabsan yahay — WOULD waxaa leh qof kale ama xaalad kale: I wish IT would stop raining."],
["Regret modals: should have, and speaking up for health","Modals qoomamo: should have, iyo caafimaadka u doodid","SHOULD HAVE + qaabka saddexaad waxay sheegtaa wax sax ahaa oo aan dhicin: I SHOULD HAVE BOOKED the test earlier — ma ballansan, waan ka qoomamaynayaa. OUGHT TO HAVE waa isku macno, oo ka rasmi san. Diidmo iyo cayrin: You SHOULDN'T HAVE WAITED so long. U-doodidda caafimaadkuna (advocacy) waa xirfad B2: inaad astaamaha si faahfaahsan u sharaxdo, fikrad labaad si edeb leh u codsato, go'aan caymisna qoraal edeb leh ku diido: I am writing to ask you to reconsider the decision about my treatment. Xuquuqdaadu waa inaad fahanto oo aad su'aalo weydiiso."],
["Legal and admin English: obligation passives and rights","Ingiriisiga sharciga iyo maamulka: passive waajib iyo xuquuq","Warqadaha rasmiga ahi passive iyo waajib bay ka buuxaan: Applications MUST BE SUBMITTED before Friday, documents WILL BE CHECKED, forms ARE PROCESSED in ten days. Xuquuqda: you ARE ENTITLED TO a copy — xaq baad u leedahay nuqul; you HAVE THE RIGHT TO appeal — racfaan baad xaq u leedahay. Waajibaadka: you ARE REQUIRED TO sign — waa inaad saxiixdo. Waqti-xaddidyada (deadlines) mar walba qor oo kalandarka gali. Erayada furaha ah: submit, process, appeal, deadline, clause, entitled, required — mid kasta, foomkaaga ka hor si taxaddar leh u akhri."],
["Participle clauses in stories: openings and suspense","Jumlado participle sheekooyinka: furitaanno iyo xiiso","Sheekooyinka heerka B2, participle clause-ku wuxuu abuuraa muuqaal socda oo filim u eg: Walking home in the rain, I heard my name. Frightened by the noise, the child ran inside. Having waited ten years, he finally returned. Qaabka -ING waa muuqaalka gadaasha, qaabka saddexaad waa xaalad ama sabab, HAVING + qaabka saddexaadna waa wixii intaas ka horreeyay. Marka aad la isbarbar dhigto past simple-ga caadiga ah, participle-ku wuu ka gaaban yahay, sawirkiisuna waa ka nool yahay. La soco: qofka jumladda yar waa inuu waafaqaa qofka jumladda weyn, haddii kale sheekadu way jahwareertaa."],
["Idioms and collocations in natural speech","Hal-ku-dhegyo iyo isku-dhafka erayada hadalka dabiiciga ah","IDIOM waa isku-dhaf erayo oo macnahoodu aan eray-eray loo turjumi karin: BREAK THE ICE waa wadahadal si fudud u bilaabid, A PIECE OF CAKE waa wax aad u fudud, UNDER THE WEATHER waa xanuun yar dareemid, COST AN ARM AND A LEG waa qiimo aad u badan. COLLOCATION waa erayo si dabiici ah isula socda: MAKE a decision (ee ma aha do a decision), TAKE a photo, HEAVY rain. Heerka B2: hal-ku-dhegyada ugu caansan mid mid u baro, macnahooda iyo goobta ay ku habboon yihiin: qoraalka rasmiga ah ha ku isticmaalin, hadalka saaxiibbada iyo shaqadana waa calaamad hadal dabiici ah."],
["Reporting verbs in depth: suggested, agreed, refused","Falasha soo-sheegidda si qoto dheer: suggested, agreed, refused","Kulamadu waxay u baahan yihiin falal soo-sheegid oo sax ah, mid kastaana qaab u gaar ah ayuu leeyahay. SUGGEST + -ing: She suggested HOLDING the meeting online. AGREE + to: The team agreed TO EXTEND the deadline. REFUSE + to: He refused TO SIGN. PROMISE + to, OFFER + to, DECIDE + to. ADVISE iyo WARN + qof + to: She advised us TO arrive early. Qaababkan haddii la isku khaldo, macnuhu wuu beddelmaa ama jumlada ayaa khaldanta. Qoraalka kulanka (minutes) waa inuu si cad u qoro: qofka, waxa la go'aamiyay, iyo ficilka xiga ee la qabanayo."],
["Hedging: cautious academic language","Jilicsanaan: luqad aqooneed oo taxaddar leh","Cilmi-baaristu si taxaddar leh ayay u hadashaa. HEDGING waa luqadda jilicsan ee aan si buuxda u ballanqaadin: The evidence SUGGESTS — caddayntu waxay tilmaamaysaa; results TEND TO show; this MAY indicate; it APPEARS TO be. Sababtu waa daacadnimo aqooneed: hal daraasad wax walba ma caddayso. Isbarbar dhig: This proves... waa aad u xoog badan yahay, halka This suggests... uu yahay mid sax ah oo taxaddar leh. Erayada kale ee jilicsan: roughly, approximately, in most cases, generally. Heerka B2, kalsoonida dhabta ahi waa inaad sheegto waxaad taqaanno iyo waxaad weli hubin la'dahay, labadaba."],
["Cleft sentences and emphasis for persuasion","Jumlado kala-qaybsan iyo xoog-saar qancin","CLEFT SENTENCE waxay jumladda u kala qaybisaa si qaybta muhiimka ahi u iftiinto: WHAT MATTERS MOST IS being heard — waxa ugu muhiimsan waa in la dhagaysto. IT WAS OUR COMMUNITY THAT changed the decision — waxay ahayd bulshadayadii tii beddeshay go'aanka. IT WAS THEN THAT I understood. Qalabka kale ee qancinta: su'aalo aan jawaab la filayn (rhetorical questions): How many more families must wait? iyo saddexleeyda (rule of three): our children, our schools, our future. Hababkani waa kuwa khudbadaha iyo warqadaha ololaha — hal mar oo si fiican loo dhigo ayaa ka xoog badan toban mar oo daciif ah."],
["Mixed B2 grammar review","Dib-u-eegis naxwe B2 isku dhafan","B2 oo dhan, mid kasta goobtiisa: shuruudda saddexaad (tegay oo aan dib loo beddeli karin) iyo tan isku dhafan (sababeed tegay, natiijo hadda), passive waqti kasta iyo passive aan qof lahayn (warar iyo warbixinno), hadal la soo sheegay oo qoto dheer (su'aalo, codsiyo, amarro iyo falal soo-sheegid), participle clauses (warbixinno iyo sheekooyin), inversion (xoog-saar hadal), modals male iyo qoomamo (must have, should have), wish iyo if only, erayo xiriiriye, register-ka rasmiga ah, paraphrase iyo soo koobid, hedging iyo jumlado kala-qaybsan. Imtixaanka B2: qaabka saxda ahi waa kala badh shaqada; badhka kale waa inaad qaabka hawl dhab ah ku isticmaasho, waqti cayiman gudahaan."]
];

function b2Vocab(ui,part){
 var U=B2_VU[ui];var out=[];
 for(var k=0;k<8;k++){var combo=part*8+k;var noun=U.n[combo%U.n.length];var mod=U.m[Math.floor(combo/U.n.length)%U.m.length];var en=(mod[0].trim()+" "+noun[0]);var so=(noun[1]+" "+mod[1]);var exEn=U.t[0].replace("{v}",en);var exSo=U.t[1].replace("{v}",so).replace("{vs}",so).replace("{Vs}",cap(so));out.push({en:en,so:so,exEn:exEn,exSo:exSo,ph:en.toLowerCase().replace(/tion/g,"shun").replace(/ph/g,"f").replace(/ck/g,"k").replace(/qu/g,"kw").replace(/igh/g,"y").replace(/ /g," - ")})}
 return out;
}

  var reading={en:"Reading about "+tt[0]+": "+v[0].exEn+" "+v[1].exEn+" "+v[2].exEn+" "+v[5].exEn+" "+v[6].exEn+" This B2 text is longer on purpose. First, Ayaan reads both parts for the general meaning and decides what the main point is. Then she reads again and separates facts from opinions: a fact can be checked, but an opinion shows what a person thinks or feels. Finally, she answers an inference question — a question whose answer is not written directly, but can be worked out from clues in the text. The key inference here is this: people who prepare carefully, listen to the other side and explain their reasons clearly usually reach better decisions than people who only speak first and loudest.",so:"Akhris ku saabsan "+tt[1]+": "+v[0].exSo+" "+v[1].exSo+" "+v[2].exSo+" "+v[5].exSo+" "+v[6].exSo+" Qoraalkan B2 waa mid dheer si ula kac ah. Marka hore, Ayaan waxay labada qaybood u akhridaa macnaha guud oo waxay go'aamisaa waxa qodobka ugu weyn yahay. Kadib mar kale ayay akhridaa oo waxay kala saartaa xaqiiqooyinka iyo fikradaha: xaqiiqda waa la hubin karaa, fikradduse waxay muujisaa waxa qofku u malaynayo ama dareemayo. Ugu dambayn, waxay ka jawaabtaa su'aal faham dahsoon ah — su'aal aan jawaabteedu si toos ah u qornayn, laakiin tilmaamaha qoraalka laga soo saari karo. Fahamka dahsoon ee ugu muhiimsan halkan waa kan: dadka si taxaddar leh u diyaar garooba, dhinaca kale dhagaysta, oo sababtooda si cad u sharxa, inta badan waxay gaadhaan go'aanno ka wanaagsan kuwa marka hore iyo codka ugu dheer uun hadla."};

var C_GRAMMAR=[
["Idioms, collocations and fixed expressions in depth","Hal-ku-dhegyo, isku-dhafyo iyo odhaahyo sugan si qoto dheer","Heerka C1: macnuhu inta badan erayada isku dhafan ayuu ku jiraa, ma aha eray keligiis. COLLOCATION waa lammaane dabiici ah: MAKE a decision, COMMIT a crime, HEAVY traffic. IDIOM waa odhaah aan eray-eray loo turjumi karin: the ball is in your court = wareeggaagu waa yimid. Cashir kasta: hal-ku-dhegga macnihiisa, goobta uu ku habboon yahay (rasmi/mid aan rasmi ahayn), iyo digniin haddii uu duugoobay ama uu edeb-darro noqon karo u baro."],
["Nominalization and academic style","Magac-ka-dhigid iyo qaabka aqooneed","Magac-ka-dhigiddu falka waxay u beddeshaa magac: decide waxay noqotaa DECISION, develop waxay noqotaa DEVELOPMENT, fail waxay noqotaa FAILURE. Qoraalka aqooneedku qaabkan ayuu jecel yahay maxaa yeelay wuxuu fikradda cuf ka dhigaa, mawduuca cusubna jumladda ayuu hor dhigaa: The DECISION to expand the service followed a review of the EVIDENCE. Laakiin xad-dhaafku wuu mugdiyeeyaa: markaad qofka falka sameeyay muhiim tahay, falka tooska ah isticmaal."],
["Subtle tense and aspect nuance","Farqiga daahsoon ee waqtiga iyo qaabka falka","C1, waqtiyadu macno daahsoon bay kala qaadaan. PAST PERFECT CONTINUOUS (had been waiting) waxay muujisaa muddo ilaa waqti tegay. FUTURE PERFECT (will have finished) waa dhammaad mustaqbal cayiman ka hor. PRESENT PERFECT vs PAST SIMPLE: caddaymo hadda muuqda vs dhacdo xiran oo tegay. Doorashadu waxay beddeshaa waxa dhagaystuhu fahmo ee ku saabsan sababta, muddada iyo natiijada — naxwe oo keliya ma aha, waa macno."],
["Hedging, stance and academic caution in depth","Jilcin, mawqif iyo taxaddar aqooneed si qoto dheer","Qoraaga C1 wuxuu si sax ah u qiyaasaa hubintiisa: The data SUGGEST (tilmaam), results are CONSISTENT WITH (waafaqsan), this TENDS to (badanaa). STANCE waa booskaaga qoraalka: adigoo si cad u leh In this essay I argue..., ama si dahsoon u dhisa. Caddayn xoog leh waxay u baahan tahay erayo xoog leh, caddayn daciif ahna jilcin daacad ah. Labaduba waa xirfad; midka khaldani waa sheegasho ka weyn caddaynta."],
["Rhetoric: appeals, framing and structure","Kala-hadal: racfaan, habayn iyo qaab","Dood xoog leh saddex racfaan bay isku dheellitirtaa: ETHOS (kalsoonida qofka hadlaya), PATHOS (dareenka dhagaystaha), LOGOS (macquulnimada iyo caddaynta). FRAMING waa su'aasha la dejiyo: canshuur waa culays (burden) mise waa maalgashi (investment)? Qaabku wuu raacaaa: dhibaato, sabab, xal, codsi. Hadal-hayuhu ma aha inuu qayliyo; waa inuu dhagaystaha u sahlaa inuu go'aanka saxda ah isagu gaadho."],
["Literary language: metaphor, symbol, voice","Luuqad suugaaneed: tusaale, astaan, cod","Suugaanta, macnuhu lakabyo buu leeyahay. METAPHOR waa isbarbardhig dahsoon: time is a thief. SYMBOL waa shay macno ka weyn isaga xambaarsan: albaab xiran waa fursad luntay. VOICE waa codka sheegaha — da'diisa, aragtidiisa, kalsoonidiisa. Akhristaha C1 wuxuu weydiiyaa: yaa hadlaya? maxaa aan la sheegin? muxuu qoraagu iga doonayaa inaan dareemo, maxaase iga qarinayaa?"],
["Advanced listening: inference, attitude, signposting","Dhegeysi sare: faham dahsoon, aragti, calaamado","Muxaadarooyinka iyo barnaamijyada, macnuhu marar badan si dahsoon ayuu ku jiraa. SIGNPOSTS waa calaamadaha hadalka: Turning to..., The key point here is..., In short.... ARAGTI (attitude) codka, xawliga iyo erayada qiimeynta ayaa muujiya: frankly, predictably, admittedly. FAHAM DAHSOON waa gabagabo laga soo saaro tilmaamo. Istaraatiijiyad: marka hore dhismaha raac (calaamadaha), kadib faahfaahinta, ugu dambeeyn aragtida hadlaayaha go'aami."],
["Advanced conditionals, inversion and debate language","Shuruudo sare, inversion iyo luqadda doodda","Doodda rasmiga ah, qaabab sare waa hubkaaga: inversion kadib eray taban (Never has the need been greater), shuruud la muujiyay SHOULD, WERE IT NOT FOR (haddaanay jiri lahayn), PROVIDED THAT (shardi ah in). Su'aalaha isdhaafka ah (cross-questions) jawaab gaaban oo sax ah baa u baahan, kadibna ku noqo qodobkaagii: That may be true, but the question before us is...."],
["Subjunctive and formal recommendation structures","Subjunctive iyo qaabab talo rasmi ah","Subjunctive-ku wuxuu ka muuqdaa talooyinka rasmiga ah: We recommend THAT the service BE extended — BE, ma aha IS. Qaabab kale: It is essential THAT every applicant SUBMIT the form; I suggest THAT he BE informed. Wareysiyada iyo warbixinnada, qaabkani waa calaamad luqad sare oo rasmi ah. Luqadda maalinlaha ah waa dhif; qoraalka rasmiga ah, talada iyo soo-jeedinta waa meelaha ugu badan."],
["Data commentary and referencing in presentations","Faallo xogeed iyo tixraac bandhigyada","Bandhig cilmi-baaris: xogta ha akhriyin, FAALLAYSO: The figures rise sharply until 2022, then level off — tirooyinku si xoog leh bay u kaceen ilaa 2022, kadib way istaageen. Isbarbardhig, isbeddel iyo waxa la yaabka leh sheeg. Tixraacu waa daacadnimo: As shown in Figure 2...; According to the 2023 survey.... Ilaha oo la sheego waxay dhistaa kalsoonida dhagaystaha, khaasatan markaad tirooyinka adag soo bandhigaysid."],
["Register shifting and cross-cultural pragmatics","Beddelidda hab-luqadda iyo pragmatics dhaqamo","Qofka C1 wuxuu HAB-LUQADDA u beddelaa qofka iyo goobta: saaxiib (chatty), maamule (professional), gole (formal). PRAGMATICS waa waxa erayadu sameeyaan, ma aha macnahooda oo keliya: Could you possibly...? waa codsi la jilciyay; Send it today waa amar. Dhaqamada, toosnaantu waxay noqon kartaa edeb ama edeb-darro — fasiraadda waa inaad qofka dhagaysataa, ee ma aha erayada oo keliya."],
["Humour, irony and understatement","Kaftan, jeesjees iyo yaraysiin","IRONy waa dhihid lidka waxaad u jeeddo, dhagaystuhuna farqiga ayuu maqlaa: Lovely weather — roob xoog leh oo da'aya. UNDERSTATEMENT waa yaraysiin ula kac ah: The exam was a bit challenging — imtixaan aad u adkaa. Kaftanku wuxuu u baahan yahay waqti, cod iyo akhris qof — sidaas darteed luqad labaad waa tan ugu adag. Xeer ammaan ah: naftaada kaftan, dadka kale ha kaftamin ilaa aad si dhab ah u taqaanid."],
["Diplomatic and formal correspondence structures","Qaababka warqadaha diblomaasiga iyo rasmiga ah","Warqad adag waxay u baahan tahay qaab dejiya: ujeeddada marka hore si edeb leh sheeg, xaqiiqooyinka si isku xigta u dhig, codsiga si cad u samee, dhammaadkuna ha noqdo mid albaab furan ka taga: I would welcome the opportunity to discuss this further. Erayada diblomaasiga ahi waa kuwa aan eedda dusha saarin: It appears that the payment has not yet been received — waxay u muuqataa in lacagtii weli gaarin, halkii You did not pay."],
["Critical thinking language: evaluation and fallacies","Luuqadda fikirka naqdiga: qiimeyn iyo khaladaad","Naqdigu luqad sax ah ayuu u baahan yahay: The claim RESTS ON a single study — sheegashadu daraasad keliya bay ku tiirsan tahay. Fallacy-yada ugu caansan: ATTACKING THE PERSON (ad hominem), FALSE CHOICE (laba dookh oo keliya), HASTY GENERALISATION (hal tusaale oo qof walba loo nisbeeyo). Markaad naqdiso, nooca ugu adag ee doodda ka jawaab (steel-man), ee ma aha kan ugu daciifsan — taasi waa calaamad fikir bisayl."],
["Specialist vocabulary, word families and precision","Erayo gaar ah, qoysas erayo iyo saxnaan","Goob kastaa erayadeeda saxda ah bay leedahay: caafimaadka DIAGNOSIS, PRESCRIPTION, REFERRAL; sharciga ENTITLEMENT, LIABILITY, APPEAL. WORD FAMILY-ga baro: decide, decision, decisive, decisively — hal xidid, afar qaab. Saxnaantu waa xushmad: erayga saxda ah ee goobtaas wuxuu muujiyaa inaad fahamtay nidaamka, ma aha erayga oo keliya. Eray guud oo meel gaar ah la dhigo wuxuu abuuraa faham-xumo qaali ah."],
["Ellipsis, substitution and fluent cohesion","Dhaafis, beddelid iyo isku-xir faseex ah","Hadal faseex ah wuxuu ka tagaa waxa la fahmi karo: (Are you) Coming?; I think so (so = waxa aan u malaynayo); Mine is the red one (one = shayga). ELLIPSIS waa dhaafis, SUBSTITUTION waa eray yar oo beddela mid weyn: so, one, do. Kuwaani hadalka waxay ka dhigaan mid dabiici ah oo aan isku celcelin lahayn. Qoraalka rasmiga ah waa laga taxaddaraa; hadalka iyo qoraalka aan rasmiga ahayn waa calaamad faseexnimo."],
["Creative writing craft: voice, pacing, dialogue","Farshaxanka qoraalka hal-abuurka: cod, xawaare, wadahadal","Cod (VOICE) waa shakhsiyadda bogga: jumladahaaga, laxankaaga, waxaad dareento. Xawaaruhu (PACING) waa kantaroolka akhristaha: muuqaal gaabis ah oo faahfaahsan, ficil degdeg ah oo jumlad gaaban leh. Wadahalku waa inuu shaqo qabtaa: dabeecad muujiyaa ama sheekada hor mariyaa — wadahadal kasta oo labadaba qaban waaya waa la jaraa. Dib-u-sixiddu waa qoraalka dhabta ah: qabyada koowaad waa helitaan, tan labaadna waa farshaxan."],
["Integrated exam skills and synthesis","Xirfadaha imtixaanka isku dhafan iyo soo-dhufan","Hawlaha isku dhafan (integrated tasks) waxay isku daraan xirfado: akhri qoraal, dhagayso hadal, kadib qor soo-koobid labadaba isku xidha. SYNTHESIS waa soo-dhufan: ma aha laba soo-koobid oo isku dheggan, waa qoraal cusub oo labada il isku xiriiriya. Istaraatiijiyad: il kasta fikradiisa ugu weyn xariiq hoosta ka mar, isku xirka raadi (isku mid, kala duwan, sabab-natiijo), kadib qor — waqtigaaga kala badh qorshayn iyo hubin u dhig."],
["Project language: proposals, evaluation, reflection","Luuqadda mashaariicda: soo-jeedin, qiimeyn, dib-u-fikir","Mashruuc heer sare ah luqaddiisu waa tan qiimeynta: The aim of this project is to...; The evidence collected suggests...; One limitation was...; If I repeated the project, I would.... DIB-U-FIKIR (reflection) waa inaad si daacad ah u sheegto waxa shaqeeyay, waxa aan shaqeyn, iyo waxad baratay — ma aha inaad naftaada ammaanto oo keliya. Faylkaaga (portfolio) waa caddaynta horumarkaaga oo dhan."],
["Full C1-C2 synthesis review","Dib-u-eegis soo-dhufan C1-C2 oo buuxda","Heerarka C1-C2 oo dhan waa hal nidaam: erayo sare iyo isku-dhafyo, naxwe daahsoon (subjunctive, inversion, ellipsis, magac-ka-dhigid), hab-luqad sax ah, dood iyo qancin, dhegeysi iyo akhris naqdi leh, qoraal rasmi iyo hal-abuur leh. Qiimeynta ugu dambeysa waxay isku dartaa dhammaan: hubin isku dhafan oo 20 su'aalood ah, bandhig hadal oo dheer, iyo maqaal qoraal ah. Guushu ma aha eray kasta oo sax ah — waa isgaarsiin cad, kalsooni leh, oo goob kasta ku habboon."]];

 for(var k=0;k<8;k++){var combo=part*8+k;var noun=U.n[combo%U.n.length];var mod=U.m[Math.floor(combo/U.n.length)%U.m.length];var en=(mod[0].trim()+" "+noun[0]);var so=(noun[1]+" "+mod[1]);var exEn=U.t[0].replace("{v}",en);var exSo=U.t[1].replace("{v}",so).replace("{vs}",so).replace("{Vs}",cap(so));out.push({en:en,so:so,exEn:exEn,exSo:exSo,ph:en.toLowerCase().replace(/tion/g,"shun").replace(/ph/g,"f").replace(/ck/g,"k").replace(/qu/g,"kw").replace(/igh/g,"y").replace(/ /g," - ")})}
 return out;
}

  var wp=isFinal?{en:"GRADUATION ESSAY TASK: Write a full essay (250–300 words) — 'My English journey and what I can do now' — plus be ready to give an extended speaking presentation (3–4 minutes) on the same topic. Essay structure: an engaging opening, two developed body paragraphs with evidence from your own learning, one paragraph that considers a difficulty honestly, and a conclusion that looks forward. Use at least three of this lesson's words, hedging where evidence is limited, and nominalization in the formal sentences. This essay, the presentation, and the 20-question check together form your Academy Final Assessment.",so:"HAWSHA MAQAALKA QALIN-JABINTA: Qor maqaal buuxa (250–300 eray) — 'Safarkayga Ingiriisiga iyo waxa aan hadda awoodo' — sidoo kalena diyaar u noqo bandhig hadal oo dheer (3–4 daqiiqo) oo isla mawduuca ah. Qaabka maqaalka: furitaan soo jiidasho leh, laba tuduc oo la faahfaahiyay oo caddaymo barashadaada laga soo qaatay, hal tuduc oo dhibaato si daacad ah u eega, iyo gabagabo mustaqbalka eegta. Isticmaal ugu yaraan saddex eray oo cashirkan ah, jilcin meelaha caddayntu xaddidan tahay, iyo magac-ka-dhigid jumladooyinka rasmiga ah. Maqaalkan, bandhigga, iyo hubinta 20-ka su'aalood ayaa wada ah Qiimeyntaada Ugu Dambeysa ee Akadeemiyadda."}:(part%3===0?{en:"Write a formal letter (180–220 words) about \""+tt[0]+"\" using \""+v[1].en+"\" and \""+v[2].en+"\". Structure: precise subject line in your opening sentence, background in one paragraph, your case with evidence in a second paragraph, a diplomatic request, and a closing that leaves the door open (I would welcome the opportunity to discuss this further). Avoid contractions in the most formal sentences; check register, hedging and punctuation as a final pass.",so:"Qor warqad rasmi ah (180–220 eray) oo ku saabsan \""+tt[1]+"\" adoo isticmaalaya \""+v[1].en+"\" ("+v[1].so+") iyo \""+v[2].en+"\" ("+v[2].so+"). Qaabka: ujeeddada jumladda furitaanka si sax ah, asalka hal tuduc, dacwaddaada caddayn leh tuduc labaad, codsi diblomaasi ah, iyo xiritaan albaab furan ka taga (I would welcome the opportunity to discuss this further). Jumladooyinka ugu rasmisan isku-darka ka fogow; hab-luqadda, jilcinta iyo calaamadaha qoraalka maritaankii ugu dambeeyay hubi."}:(part%3===1?{en:"Write an academic-style essay (200–250 words) about \""+tt[0]+"\" using \""+v[1].en+"\" and \""+v[2].en+"\". Structure: a thesis in the introduction, two body paragraphs each with a claim, evidence and a linking sentence, one concession paragraph (Admittedly... Nevertheless...), and a conclusion that restates your position with appropriate hedging. Nominalize at least two verbs, cite one idea in your own words (According to...), then read the essay aloud as a two-minute presentation.",so:"Qor maqaal qaab-aqooneed ah (200–250 eray) oo ku saabsan \""+tt[1]+"\" adoo isticmaalaya \""+v[1].en+"\" ("+v[1].so+") iyo \""+v[2].en+"\" ("+v[2].so+"). Qaabka: duluc hordhaca ku jira, laba tuduc oo mid kastaa sheegasho, caddayn iyo jumlo isku-xir leh, hal tuduc ogolaansho (Admittedly... Nevertheless...), iyo gabagabo mawqifkaaga jilcin habboon ku soo celisa. Ugu yaraan laba fal magac-dhig, hal fikrad erayadaada ku xig (According to...), kadibna maqaalka cod dheer ugu akhri bandhig laba daqiiqo ah."}:{en:"Write a critical summary and response (200–250 words) about \""+tt[0]+"\" using \""+v[1].en+"\" and \""+v[2].en+"\". First summarise the position fairly in about 80 words — no opinion yet. Then respond: where do you agree, where do you challenge, and what evidence decides it for you? Use steel-manning (answer the strongest version of the other side), precise specialist vocabulary, and a final sentence that states your judgement and its limits.",so:"Qor soo-koobid naqdi ah iyo jawaab (200–250 eray) oo ku saabsan \""+tt[1]+"\" adoo isticmaalaya \""+v[1].en+"\" ("+v[1].so+") iyo \""+v[2].en+"\" ("+v[2].so+"). Marka hore mawqifka si caddaalad leh ku soo koob qiyaastii 80 eray — fikrad weli ha bixin. Kadib ka jawaab function quizList(les){
 if(les.n===250||les.n===400||les.n===600||les.n===800||les.n===1000){var out=[];var offs=[3,0,5,1,4,2];for(var i=0;i<offs.length&&out.length<20;i++){exercisesFor(les,true,offs[i]).forEach(function(q){if(out.length<20)out.push(q)})}return out.slice(0,20)}

}
function quizTotal(les){return les&&(les.n===250||les.n===400||les.n===600||les.n===800||les.n===1000)?20:5}


function exercisesFor(les,quizMode,offset){
  var v=les.vocab;var ex=[];var base=offset||0;
  function V(i){return v[(i+base)%v.length]}
  ex.push({type:"mcq",q:"What does “"+V(0).en+"” mean in Somali?",qSo:"Maxay “"+V(0).en+"” ka dhigantahay Soomaali ahaan?",opts:shuffle([V(0).so,V(1).so,V(2).so,V(3).so],les.n),ans:V(0).so,why:"“"+V(0).en+"” = "+V(0).so+". Tusaale: "+V(0).exEn});
  ex.push({type:"mcq",q:"Choose the English word for: "+V(1).so,qSo:"Dooro erayga Ingiriisiga ah ee: "+V(1).so,opts:shuffle([V(1).en,V(2).en,V(3).en,V(0).en],les.n+3),ans:V(1).en,why:V(1).so+" = "+V(1).en});
  var sen=V(2).exEn;var blank=sen.replace(new RegExp(V(2).en.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"i"),"_____");
  if(blank===sen)blank=sen+" _____";
  ex.push({type:"fill",q:"Fill the blank: "+blank,qSo:"Buuxi meesha bannaan",ans:V(2).en,accept:[V(2).en.toLowerCase()],why:"Jawaabtu waa “"+V(2).en+"”. "+sen});
  var words=V(3).exEn.replace(/[.!?]/g,"").split(" ").filter(Boolean);
  ex.push({type:"order",q:"Put the words in order",qSo:"Erayada kala hagaaji si ay jumlo sax ah u noqoto",words:shuffle(words,les.n+9),ans:words.join(" "),why:"Sida saxda ah: "+V(3).exEn});
  ex.push({type:"match",q:"Match: "+V(4).en+" — ?",qSo:"Is waafaji: "+V(4).en+" macnaheedu waa maxay?",opts:shuffle([V(4).so,V(5).so,V(6).so,V(0).so],les.n+5),ans:V(4).so,why:V(4).en+" = "+V(4).so});
  ex.push({type:"translate",q:"Type in Somali: "+V(5).en,qSo:"Af-Soomaali ku qor",ans:V(5).so,accept:[norm(V(5).so),norm(V(5).so.split("/")[0]),norm(V(5).so.split("(")[0])],why:V(5).en+" = "+V(5).so});
  ex.push({type:"dictation",q:"Listen and type what you hear",qSo:"Dhegeyso oo qor waxaad maqasho",speak:V(6).exEn,ans:norm(V(6).exEn),accept:[norm(V(6).exEn)],why:"Waxaad maqashay: "+V(6).exEn});
  ex.push({type:"translate2",q:"Type in English: "+V(0).so,qSo:"Ingiriisi ku qor",ans:V(0).en,accept:[norm(V(0).en)],why:V(0).so+" = "+V(0).en});
  if(quizMode){ex.push({type:"mcq",q:"Grammar: "+les.grammar.example.split("—")[0]+" — choose the best lesson word: "+V(1).en,qSo:"Naxwe: dooro erayga cashirka ugu habboon: "+V(1).en,opts:shuffle([V(1).en,V(3).en,V(5).en,V(6).en],les.n+11),ans:V(1).en,why:les.grammar.point+". "+les.grammar.explainSo+" Tusaale / Example: "+les.grammar.example+" — "+les.grammar.exampleSo});ex.push({type:"fill",q:"Complete from the dialogue: "+(les.dialogue[0]?les.dialogue[0][1].split(" ").slice(0,3).join(" "):"")+" _____",qSo:"Ka buuxi wadahadalka cashirkan: erayga maqan qor",ans:(les.dialogue[0]?les.dialogue[0][1].split(" ")[3]||V(0).en:V(0).en),accept:[norm(les.dialogue[0]?les.dialogue[0][1].split(" ")[3]||"":"")],why:"Wadahadalka / Dialogue: "+(les.dialogue[0]?les.dialogue[0][1]:"")+" — "+(les.dialogue[0]?les.dialogue[0][2]:"")})}
  return quizMode?ex.slice(0,5).concat(ex.slice(5,7)).slice(0,5):ex;
}

 var qTf=quizTotal(cur);var mastered=qCorrect/qTf>=0.8&&exCorrect/8>=0.7;var score=Math.round((exCorrect/8)*30+(qCorrect/qTf)*70);
 if(mastered&&!S.completed[cur.id]){S.completed[cur.id]={score:score,date:todayStr()};cur.vocab.forEach(function(v){addSRS(v.en,v.so)});addActivity(10+qCorrect*2,1)}
 else{addActivity(5,0)}
 S.attempts.push({lesson:cur.n,score:score,date:todayStr()});checkBadges();save().then(function(){setNav("home");render()});

function runSpeech(target){
 var out=document.getElementById("speechOut");var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){out.innerHTML="⚠️ Browser-kani ma taageero aqoonsiga hadalka. Dhegeyso oo cod dheer ku celceli — taasi waa tababar dhab ah. (Speech check is not supported in this browser — listen &amp; repeat aloud instead.)";return}
 try{var r=new SR();r.lang="en-GB";r.interimResults=false;r.onresult=function(e){var said=e.results[0][0].transcript;var tw=norm(target).split(" ");var sw=norm(said).split(" ");var hit=tw.filter(function(w){return sw.indexOf(w)>=0}).length;if(!Array.isArray(S.skillLog))S.skillLog=[];S.skillLog.push({skill:"speaking",ok:hit===tw.length?1:0,date:todayStr()});save();out.innerHTML="Waxaad tidhi: <strong>"+esc(said)+"</strong><br>Erayada isku mid ah: <strong>"+hit+" / "+tw.length+"</strong>. "+(hit===tw.length?"🎉 Dhammaan erayadii waa sax!":"Isku day mar kale, eray kasta si cad u dheh.")+"<br><span class='small'>Tani waa isbarbardhig erayo — ma aha qiimeyn dhawaaq oo cilmi ah.</span>"};r.onerror=function(){out.textContent="Mikrofoonku ma shaqeyn. Dhegeyso oo ku celceli cod dheer."};r.start();out.textContent="🎙️ Dhegeysanayaa... hadda dheh jumladda."}catch(e){out.textContent="Mikrofoonku ma shaqeyn."}
}

/* ============ COACH ============ */
function coachIssues(t){
 var iss=[];var s=t.trim();
 if(s&&s[0]!==s[0].toUpperCase())iss.push({en:"Start with a capital letter.",so:"Jumladda xaraf weyn ku bilow.",fix:"“"+s.charAt(0).toUpperCase()+s.slice(1)+"”"});
 if(s&&!/[.!?]$/.test(s))iss.push({en:"End with a full stop (.)",so:"Jumladda ku dhammee dhibic (.)",fix:""});
 if(/\bi\b/.test(t))iss.push({en:"“I” is always capital.",so:"“I” (anigu) mar walba waa xaraf weyn.",fix:"beddel i → I"});
 if(/\bI (happy|tired|sick|hungry|fine)\b/i.test(t))iss.push({en:"After I, add AM before a feeling: “I am happy.”",so:"I dabadii ku dar AM: I am happy = waan faraxsanahay.",fix:"I am ..."});
 if(/\b(he|she) (go|learn|work|eat|drink)\b/i.test(t))iss.push({en:"For he/she, add -s: he goes, she learns.",so:"He/she markay yihiin, falalaha ku dar -s.",fix:"... + s"});
 if(/\b(dont|doesnt|cant|isnt)\b/i.test(t))iss.push({en:"Use an apostrophe: don't, can't, isn't.",so:"Apostrophe isticmaal: don't, can't.",fix:"don't / can't"});
 if(/  +/.test(t))iss.push({en:"Use single spaces between words.",so:"Erayada hal meel oo bannaan u dhexee.",fix:""});
 if(/\bbecouse\b/i.test(t))iss.push({en:"Spelling: because (not becouse).",so:"Higaad: because waa sax.",fix:"because"});
 if(/\bvery (good|happy|tired)\b/i.test(t)&&iss.length<4)iss.push({en:"Good! “very + word” makes it stronger — nice natural English.",so:"Wanaagsan! very waxay xoojisaa erayga.",fix:""});
 return iss;
}
function coachHTML(t){
 if(!t||t.trim().length<2)return '<div class="feedback bad">Qor wax yar marka hore. Write a little first.</div>';
 var iss=coachIssues(t);
 if(!iss.length)return '<div class="feedback good">✅ <strong>Wacan!</strong> Ma jiraan arrimo waaweyn. Jumladdaadu waa cad tahay. No big issues found — your sentence is clear. Isku day jahwareer kale: eray cusub ku dar!</div>';
 return '<div class="feedback bad"><strong>Baro oo hagaaji / Learn &amp; fix ('+iss.length+'):</strong>'+iss.map(function(i){return '<p>• <strong>'+esc(i.en)+'</strong><br><span>'+esc(i.so)+'</span>'+(i.fix?' <em>'+esc(i.fix)+'</em>':"")+'</p>'}).join("")+'<p class="small">Tallaabada xigta: adigu hagaaji qoraalkaaga, kadib mar kale “Hubi” taabo. Hagaajintu waa meesha waxbarashadu ka dhacdo.</p></div>';
}

 else if(!due.length)h+='<div class="card"><h2>✅ Ma jiraan wax maanta ku sugaya</h2><p>'+S.srs.length+' kaar baad haysataa, dhammaan waa jadwalaysan yihiin. Berri soo noqo!</p></div>';

function showCard(due,i){
 var box=document.getElementById("srsBox");if(!box)return;if(i>=due.length){box.innerHTML='<h2>🎉 Dib-u-eegistii maanta waa dhammaatay!</h2><p>+'+(due.length*2)+' XP</p>';addActivity(due.length*2,0);save().then(render);return}
 var c=due[i];var mode=i%3;
 box.innerHTML='<p class="small muted">Kaarka '+(i+1)+' / '+due.length+'</p><h2 style="font-size:24px">'+(mode===1?esc(c.so):esc(c.en))+'</h2><p>'+(mode===2?speakBtn(c.en):"")+(mode===1?"Ingiriisi ku dheh / Say it in English":"Soomaali ku dheh / Say it in Somali")+'</p><button class="btn secondary" id="showAns">Muuji jawaabta</button><div id="ansBox"></div>';
 document.getElementById("showAns").addEventListener("click",function(){document.getElementById("ansBox").innerHTML='<p style="font-size:19px"><strong>'+(mode===1?esc(c.en):esc(c.so))+'</strong> '+speakBtn(c.en)+'</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn amber" data-grade="0">Mar kale / Again</button><button class="btn secondary" data-grade="1">Wacan / Good</button><button class="btn" data-grade="2">Fudud / Easy</button></div>';bindSpeak(box);box.querySelectorAll("[data-grade]").forEach(function(b){b.addEventListener("click",function(){var g=+b.dataset.grade;var intervals=[1,3,7,16,35];if(g===0)c.box=0;else if(g===2)c.box=Math.min(4,c.box+2);else c.box=Math.min(4,c.box+1);c.due=Date.now()+intervals[c.box]*86400000;save();showCard(due,i+1)})})});
 bindSpeak(box);
}
