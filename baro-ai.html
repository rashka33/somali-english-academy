<!doctype html>
<html lang="so">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#faf5ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161511" media="(prefers-color-scheme: dark)">
<title>Baro AI — AI ku baro Af-Soomaali</title>
<meta name="description" content="Baro AI: AI ku baro Af-Soomaali. Learn AI in Somali.">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--paper:#faf5ec;--surface:#fff;--ink:#1b1a17;--ink-2:#605c54;--line:#e6e0d5;--soft:#f2ede4;--accent:#0e7c66;--accent-ink:#fff;--accent-soft:#e1f1ec;--deep:#0a5c4c;--gold-soft:#fbf1d9;--gold-ink:#7a5606;--ok:#1f7a4d;--ok-soft:#e3f3ea;--bad:#b3261e;--bad-soft:#fbe4e2}
@media (prefers-color-scheme:dark){:root{--paper:#161511;--surface:#201e19;--ink:#f3efe7;--ink-2:#b5afa3;--line:#35322b;--soft:#292721;--accent:#5fcdb2;--accent-ink:#0c1f1b;--accent-soft:#17332d;--deep:#7fdcc4;--gold-soft:#3a2f14;--gold-ink:#f6d995;--ok:#5ccf8f;--ok-soft:#1d3328;--bad:#ff8a80;--bad-soft:#3b1f1d}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1rem/1.6 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
header{max-width:720px;margin:0 auto;padding:16px;display:flex;align-items:center;gap:12px}
header img{width:40px;height:40px;border-radius:10px}
header strong{display:block;font-weight:700}header span{font-size:.875rem;color:var(--ink-2)}
#app{max-width:720px;margin:0 auto;padding:8px 16px 32px}
h1,h2{font-family:"Bricolage Grotesque",Inter,system-ui,sans-serif;line-height:1.15;letter-spacing:-.01em}
h1{font-size:2rem;margin:.2em 0 .4em;text-wrap:balance}h2{font-size:1.25rem;margin:1.2em 0 .4em}
.hero-eyebrow{margin:0;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.simple-intro{color:var(--ink-2);margin:0 0 16px}
.ai-roadmap{display:grid;gap:8px}
.ai-stage{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:12px 16px;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);text-align:left;font:inherit;cursor:pointer}
.ai-stage:not(:disabled):hover{border-color:var(--accent)}
.ai-stage.is-coming{opacity:.6;cursor:default}
.ai-stage-num{flex:0 0 32px;height:32px;border-radius:999px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700}
.ai-stage-copy{flex:1;display:grid;gap:2px;min-width:0}.ai-stage-copy small{color:var(--ink-2);font-size:.875rem;line-height:1.4}
.ai-coming{font-size:.8125rem;font-weight:700;color:var(--accent)}.is-coming .ai-coming{color:var(--ink-2)}
.ai-lesson-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.ai-english{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:.9375rem}
.ai-prompt{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;background:var(--paper)}
.ai-prompt code{display:block;font:inherit;margin-bottom:6px;white-space:pre-wrap}
.ai-progress p{margin:0 0 6px;font-size:.875rem;color:var(--ink-2)}
.simple-progress{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin-bottom:16px}.simple-progress i{display:block;height:100%;background:var(--accent)}
.ai-options{display:grid;gap:8px;margin:12px 0}
.ai-options button{min-height:52px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.ai-options button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.ai-checklist{padding-left:20px}
.simple-primary{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:12px 20px;margin-top:12px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;cursor:pointer}
.simple-back,.simple-text-button{min-height:44px;padding:8px 0;border:0;background:none;color:var(--accent);font:inherit;font-weight:600;cursor:pointer}
.feedback{padding:10px 12px;border-radius:12px;margin:12px 0 0}.feedback.good{background:var(--ok-soft);color:var(--ok)}.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.small{font-size:.875rem}.muted{color:var(--ink-2)}
footer{max-width:720px;margin:0 auto;padding:24px 16px 40px;border-top:1px solid var(--line);font-size:.875rem;color:var(--ink-2)}
</style>
</head>
<body>
<header><img src="icon-192.png" alt=""><div><strong>Baro AI</strong><span>Somali English Academy</span></div></header>
<main id="app" aria-live="polite"></main>
<footer><a href="academy.html">← Ku noqo Somali English Academy</a><p>Horumarkaaga Baro AI wuxuu ku kaydsan yahay aaladdan. / Your Baro AI progress is saved on this device.</p></footer>
<script>
(function () {
  var KEY = 'sea-baro-ai';
  window.app = document.getElementById('app');
  window.view = 'ai';
  var stored = null; try { stored = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
  window.S = { profile: { ui: 'so', onboarded: false }, baroAI: stored || undefined, mistakes: [], srs: [] };
  window.save = function () { try { localStorage.setItem(KEY, JSON.stringify(S.baroAI || null)); } catch (e) {} return Promise.resolve(); };
  window.todayStr = function () { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  window.setNav = function (v) { window.view = v; };
  window.render = function () { if (typeof window.renderBaroAI === 'function') window.renderBaroAI(); window.scrollTo(0, 0); };
  window.renderHome = function () {}; window.renderProfile = function () {};
  window.addSRS = function () {}; window.mistakeAdd = function () {}; window.mistakeCorrect = function () {};
  function start() { var s = document.createElement('script'); s.src = 'baro-ai.js'; s.onload = function () { render(); }; document.body.appendChild(s); }
  if (stored) { start(); return; }
  var started = false; function once() { if (!started) { started = true; start(); } }
  setTimeout(once, 800);
  try {
    var req = indexedDB.open('zamzam-academy', 1);
    req.onupgradeneeded = function () { if (!req.result.objectStoreNames.contains('kv')) req.result.createObjectStore('kv'); };
    req.onsuccess = function () {
      try {
        var get = req.result.transaction('kv', 'readonly').objectStore('kv').get('state');
        get.onsuccess = function () {
          var st = get.result, p = st && st.profiles ? (st.profiles[st.activeId] || st.profiles[Object.keys(st.profiles)[0]]) : st;
          if (p && p.baroAI && typeof p.baroAI === 'object') { S.baroAI = p.baroAI; save(); }
          if (p && p.profile && p.profile.ui) S.profile.ui = p.profile.ui;
          once();
        };
        get.onerror = once;
      } catch (e) { once(); }
    };
    req.onerror = once;
  } catch (e) { once(); }
})();
</script>
</body>
</html>
